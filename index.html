<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Masarif">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Masarif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one white mobile column, sticky period bar on top, fixed tab bar at the bottom, edit forms in a bottom sheet.
   Single bright white look by design; each category carries its own color. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F6F7FB; --sunk:#EEF1F6; --ink:#151827; --muted:#667085; --line:#E8EBF2;
  --accent:#0F9D74; --on-accent:#FFFFFF;
  --hero:linear-gradient(135deg,#0F9D74 0%,#14B8A6 52%,#0EA5E9 100%);
  --need:#10B981; --want:#F97316; --debt:#6366F1; --none:#9AA3B2;
  --bad:#E5484D; --warn:#F59E0B; --good:#10B981;
  --shadow:0 1px 2px rgba(21,24,39,.05),0 10px 30px rgba(21,24,39,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero);display:grid;place-items:center;color:#fff;font:800 17px var(--f-display);box-shadow:0 4px 12px rgba(15,157,116,.35)}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:-.015em}
.brand span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.month{display:flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:#fff;width:30px;height:30px;border-radius:999px;font-size:17px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.month span{font-weight:700;font-size:13.5px;min-width:112px;text-align:center;padding:0 4px}

/* Sections and cards */
section.view{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h2{font:700 18px/1.2 var(--f-display);margin:0;text-wrap:balance}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.link{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}

/* Hero */
.hero{background:var(--hero);color:#fff;border:0;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 34px rgba(14,165,233,.22),0 6px 14px rgba(15,157,116,.2);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero > *{position:relative;z-index:1}
.hero .label{color:rgba(255,255,255,.85)}
.hero .big{font:800 clamp(36px,11vw,50px)/1 var(--f-display);letter-spacing:-.025em}
.hero .big small{font-size:.38em;font-weight:700;opacity:.85;margin-right:6px;letter-spacing:0}
.hero .sub{font-size:13px;color:rgba(255,255,255,.88)}
.hero .neg{color:#FFE4E1}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:9px 11px;min-width:0}
.pill div:first-child{font-size:12px;opacity:.9}
.pill div:last-child{font:800 17px var(--f-display)}
.pills.two{grid-template-columns:repeat(2,1fr)}
.plan-card{border:0;color:#fff;display:flex;flex-direction:column;gap:16px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16),transparent 60%),linear-gradient(150deg,#6D28D9,#4338CA 60%,#1E3A8A);box-shadow:0 14px 30px rgba(79,70,229,.28)}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.pc-big{font:800 clamp(30px,9vw,38px)/1.1 var(--f-display);letter-spacing:-.02em;margin-top:4px}
.pc-big small{font-size:.42em;opacity:.8;margin-right:5px;letter-spacing:0}
.pc-chip{background:#A7F3D0;color:#064E3B;font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;white-space:nowrap}
.pc-chip.bad{background:#FECACA;color:#7F1D1D}
.pc-pay{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pc-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pc-lab2{font-size:13px;font-weight:700;opacity:.9}
.pc-steps{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.pc-steps b{font:800 26px var(--f-display);text-align:center;white-space:nowrap}
.pc-steps button{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#4338CA;font:800 20px/1 var(--f-display);cursor:pointer}
.pc-slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;background:linear-gradient(to right,#A7F3D0 var(--p,50%),rgba(255,255,255,.25) var(--p,50%));outline:none;margin:6px 0}
.pc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);border:0}
.pc-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
.pc-ends{font-size:11.5px;opacity:.75}
#ppRes{display:flex;flex-direction:column;gap:12px}
.pc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-stats div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 11px;min-width:0}
.pc-stats span{display:block;font-size:11.5px;opacity:.8}
.pc-stats b{font:800 17px var(--f-display)}
.pc-delta{font-size:13px;font-weight:700;border-radius:12px;padding:9px 12px}
.pc-delta.good{background:rgba(167,243,208,.2);color:#D1FAE5}
.pc-delta.bad{background:rgba(254,202,202,.2);color:#FEE2E2}
.pc-chart{display:flex;flex-direction:column;gap:6px}
.pc-bars{display:flex;align-items:flex-end;gap:3px;height:84px}
.pc-bars i{flex:1;border-radius:4px 4px 1px 1px;background:linear-gradient(to top,rgba(255,255,255,.35),rgba(255,255,255,.75))}
.pc-bars i:last-child{background:#A7F3D0}
.pc-free{background:#fff;color:#1F2937;border-radius:14px;padding:11px 13px;font-size:13.5px}
.pc-free b{color:#047857}
.pc-warn{background:#FEE2E2;color:#7F1D1D;border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:700}
.btn.pc-use{background:#fff;color:#4338CA;border:0;width:100%;padding:13px}
.btn.pc-reset{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);width:100%;padding:12px}
#ppBtns{flex-direction:column;gap:8px}
#ppBtns:empty{display:none}
.goal-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 6px 2px}
.goal-empty > span:not(.ge-ic):not(.ge-amt){color:var(--muted);font-size:14px;max-width:34ch}
.goal-empty > b{font:800 18px var(--f-display)}
.ge-ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#D1FAE5;color:#047857}
.ge-amt{font:800 28px var(--f-display);color:#047857;margin:2px 0 4px}
.ge-amt small{font-size:.45em;margin-right:4px;color:var(--muted)}
.goal-empty .btn.big{width:100%;max-width:320px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.txf{display:flex;flex-direction:column;gap:14px;--k:var(--bad)}
.txf[data-kind=refund]{--k:#10B981}.txf[data-kind=income]{--k:#059669}.txf[data-kind=payment]{--k:#7C3AED}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kind{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border-radius:14px;background:var(--sunk);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;line-height:1.15}
.kind input{position:absolute;opacity:0;pointer-events:none}
.k-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;font:800 15px var(--f-display);color:var(--muted)}
.kind:has(input:checked){background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--k),0 4px 10px rgba(0,0,0,.06)}
.kind:has(input:checked) .k-ic{background:var(--k);color:#fff}
.amt-box{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;padding:12px 12px 10px;border-radius:18px;background:color-mix(in srgb,var(--k) 7%,#fff);border:1.5px solid color-mix(in srgb,var(--k) 25%,transparent)}
.amt-cur{font:800 12px var(--f-display);color:var(--muted);letter-spacing:.12em}
.amt-box input[type=text]{border:0!important;background:transparent!important;box-shadow:none!important;padding:0;width:100%;text-align:center;font:800 42px/1.1 var(--f-display);color:var(--k);letter-spacing:-.02em}
.amt-box input::placeholder{color:color-mix(in srgb,var(--k) 35%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--sunk);font-size:13.5px;font-weight:700;cursor:pointer;border:1.5px solid transparent}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip:has(input:checked){background:color-mix(in srgb,var(--c) 14%,#fff);border-color:var(--c);color:var(--ink)}
.paychips{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.paychip{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;cursor:pointer;color:#fff;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 65%,#111827));transition:opacity .15s}
.paychips:has(input:checked) .paychip:not(:has(input:checked)){opacity:.4}
.paychip input{position:absolute;opacity:0;pointer-events:none}
.paychip .pc-type{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.paychip b{font:800 15px var(--f-display);letter-spacing:.04em;white-space:nowrap}
.paychip:has(input:checked){opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.dt-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dt-row .field{min-width:0}
.dt-row input{width:100%;min-width:0;box-sizing:border-box}
.sheet-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0));display:flex;gap:10px}
.btn.big{flex:1;padding:14px;font-size:16px;border-radius:14px}
.ccard{width:100%;border:0;text-align:left;color:#fff;cursor:pointer;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;aspect-ratio:1.9/1;max-height:180px;justify-content:space-between;background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,#0B1220));box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.ccard-top,.ccard-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:700}
.ccard-top span:first-child{text-transform:uppercase;letter-spacing:.07em;opacity:.9}
.ccard-top span:last-child{font-size:14px}
.ccard-num{font:800 clamp(17px,5.4vw,21px) var(--f-display);letter-spacing:.06em;white-space:nowrap}
.ccard-bot span:first-child{opacity:.85}
.ccard-edit{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 11px}
.cfg-edit{display:flex;flex-direction:column;gap:10px;padding:4px 2px 2px}
.hero-btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);color:#fff;font:700 14px var(--f-body,inherit);border-radius:999px;padding:9px 16px;cursor:pointer}
.hero-btn.sm{padding:4px 12px;font-size:12.5px}
.hero-warn{background:rgba(255,255,255,.95);color:#B42318;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700}
.bills{display:flex;flex-direction:column;gap:8px}
.bill{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"d m a" "d m t";gap:2px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft)}
.bill-d{grid-area:d;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);line-height:1}
.bill-d b{font:800 17px var(--f-display)}
.bill-d span{font-size:11px;color:var(--muted);margin-top:2px}
.bill .mid{grid-area:m;display:flex;flex-direction:column;min-width:0}
.bill .mid span{font-size:12.5px;color:var(--muted)}
.bill .amt{grid-area:a;font-weight:800;text-align:right}
.bill-tg{grid-area:t;justify-self:end;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.bill-tg[aria-pressed=true]{background:var(--good,#10B981);border-color:transparent;color:#fff}
.bill.paid{opacity:.65}
.bill.late .mid span{color:#B42318;font-weight:700}
.nsd{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nsd span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--sunk);color:var(--muted)}
.nsd span.free{background:#D1FAE5;color:#047857}
.nsd span.today{outline:2px solid var(--accent);outline-offset:1px}
.nsd b{margin-left:4px;color:#047857}
.home-seg{margin-bottom:2px}
.bal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bal{border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-width:0;color:#fff}
.bal.acc{background:linear-gradient(135deg,#0F9D74,#14B8A6)}
.bal.cc{background:linear-gradient(135deg,#1F2937,#374151)}
.bal-lab{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.bal-amt{font:800 21px/1.1 var(--f-display);white-space:nowrap}
.bal-amt small{font-size:.5em;opacity:.85;margin-right:4px}
.bal-sub{font-size:12px;opacity:.88}
.bal-bar{height:5px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:2px}
.bal-bar i{display:block;height:100%;background:#FBBF24;border-radius:999px}
.bal-due{align-self:flex-start;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 9px;margin-top:2px}
.bal-due.soon{background:#F59E0B;color:#1F2937}
.more-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit}
.more-link > span:first-child{display:flex;flex-direction:column;gap:2px}
.more-link > span:first-child span{font-size:13px;color:var(--muted)}
.more-link > span:last-child{font-size:24px;color:var(--accent)}
.period-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.period-bar i{display:block;height:100%;background:#fff;border-radius:999px}

/* Donut */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font:800 20px var(--f-display)}
.donut .mid span{font-size:12px;color:var(--muted)}
.leg{display:flex;flex-direction:column;gap:7px;min-width:0}
.leg div{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.leg div span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{flex:0 0 10px;height:10px;border-radius:3px;background:var(--c)}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.leg{width:100%}}

/* Split bar */
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c)}

/* Budgets */
.cat-list{display:flex;flex-direction:column;gap:14px}
.cat-line{display:flex;flex-direction:column;gap:6px}
.cat-line .row b{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.bar{height:9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,#fff);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c)}
.bar i.over{background:var(--bad)}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap}
.over-tag{color:var(--bad);font-weight:700}

/* Trend chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font:600 10px var(--f-body);fill:var(--muted)}
.chart .vlab{font:700 9.5px var(--f-body);fill:var(--ink)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .avg{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.seg.mini{display:inline-flex;padding:2px}
.seg.mini button{padding:4px 12px;font-size:12.5px;flex:0 0 auto}

/* Comparison */
.cmp-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-box{background:var(--soft);border-radius:14px;padding:10px 12px}
.cmp-box div:first-child{font-size:12px;color:var(--muted)}
.cmp-box div:last-child{font:800 19px var(--f-display)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px}
.delta.up{color:#B4232A;background:#FDECEC}
.delta.down{color:#067A55;background:#E6F8F0}
.delta.flat{color:var(--muted);background:var(--sunk)}
.cmp-rows{display:flex;flex-direction:column;gap:9px}
.cmp-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:14px}
.cmp-row .nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.cmp-row .nm span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Alerts */

/* Checklist */
.habits{display:flex;flex-direction:column;gap:8px}
.habits label{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:var(--soft);cursor:pointer;font-size:14px}

.habits label:has(input:checked){background:#E8FAF3}
.habits label:has(input:checked) span{color:var(--muted);text-decoration:line-through}
.hprog{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}

/* Insights */
.ins{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ins li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--t) 9%,#fff);font-size:14px}
.ins li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--t)}
.ins li{--t:#0EA5E9} .ins li.bad{--t:var(--bad)} .ins li.warn{--t:var(--warn)} .ins li.good{--t:var(--good)}

/* Buttons and forms */
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.grad{background:var(--hero);border:0;color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}

.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],input[type=search],select,textarea{
  width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{width:32px;height:32px;border-radius:50%;background:var(--c);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){outline:3px solid var(--c);outline-offset:2px}
.swatches label:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}

/* Transactions */
.toolbar{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--c,var(--ink))}
.chips button[aria-pressed=true]{background:var(--c,var(--ink));color:#fff;border-color:var(--c,var(--ink))}
.period-h{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 2px;padding-bottom:6px;border-bottom:2px solid var(--line)}

.day{display:flex;flex-direction:column}
.day h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 4px 6px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.tx + .tx{margin-top:7px}
.tx .ic{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 15px var(--f-display);color:#fff;background:var(--c)}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tx .amt{font:800 15.5px var(--f-display);white-space:nowrap}
.tx .amt.refund{color:var(--good)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:14px 20px;background:var(--hero);color:#fff;font-weight:800;box-shadow:0 10px 24px rgba(14,165,233,.35)}

/* Empty / notes */
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:6px}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:#FFF7E6;color:#7A4B00}
.note.ok{background:#E8FAF3;color:#075E45}

/* Import preview */
.prev{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}

.prev label .mid{flex:1;min-width:0}
.prev label .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.prev .dup{opacity:.55}
.raw{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.tile{display:flex;gap:12px;align-items:flex-start}
.tile .ib{flex:0 0 42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:#fff}

/* Fixed costs editor */
.fx-list{display:flex;flex-direction:column;gap:8px}

.fx-head{display:flex;align-items:center;gap:12px;padding:12px;width:100%;border:0;background:none;text-align:left}
.fx-ic{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);font:800 16px var(--f-display)}
.fx-head .mid{flex:1;min-width:0}
.fx-head .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-head .mid span{display:block;font-size:12.5px;color:var(--muted)}
.fx-head .amt{font:800 16px var(--f-display);white-space:nowrap}
.fx-head .amt small{font:600 11px var(--f-body);color:var(--muted);margin-right:3px}
.fx-head .chev{color:var(--muted);font-size:18px;transition:transform .15s}
.fx[data-open=true] .chev{transform:rotate(90deg)}
.fx-edit{display:flex;flex-direction:column;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--soft)}
.fx-edit input{background:#fff}

.fx-ends{display:flex;gap:8px;align-items:center}
.fx-ends input{flex:1}

.fx-total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,#fff);font-weight:700}
.fx-total b{font:800 18px var(--f-display);color:var(--accent)}
/* Plan tab */
.slider{width:100%;accent-color:var(--accent);height:28px}

.goodtxt{color:var(--good)} .badtxt{color:var(--bad)}
.timeline{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line);margin-left:6px;padding-left:14px}
.timeline div{position:relative;font-size:14px}
.timeline div::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px #fff}

.owed-row .mid span{font-size:12.5px;color:var(--muted)}
.owed-row .amt{font:800 15px var(--f-display);white-space:nowrap}
.tick{border:2px solid var(--line);background:#fff;width:30px;height:30px;border-radius:50%;flex:0 0 auto;font-weight:800;color:var(--good)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;color:var(--ink);background:var(--soft);padding:0;min-width:0}
.cal button small{font-size:9.5px;font-weight:700;opacity:.85}
.cal button.zero{background:#E8FAF3;color:#067A55}
.cal button.future{opacity:.4}

.cal button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
.cal .blank{visibility:hidden}
.cal-key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.cal-key i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.sync-st{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}

code.k{font-size:12px;background:var(--sunk);padding:2px 6px;border-radius:6px;word-break:break-all}

/* Cards / payment methods */
.paygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.paytile{border:0;text-align:left;color:#fff;border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-width:0;
  background:linear-gradient(140deg,var(--c) 0%,color-mix(in srgb,var(--c) 70%,#111827) 100%);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.pt-top{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em}

.pmchip{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;color:var(--p);background:color-mix(in srgb,var(--p) 13%,#fff)}

  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

<script>
(() => {
"use strict";
/* ---------- Google Sheet store: local-first, synced through your Apps Script ---------- */
const Store = (() => {

  let docs = new Map(), fromServer = false, inbox = [], lastLoad = 0, error = "", loading = false;
  let pending = []; try { pending = JSON.parse(LS.get("masarif.pending") || "[]"); } catch {}
  try { for (const [c, id, d] of JSON.parse(LS.get("masarif.cache") || "[]")) docs.set(c + "/" + id, d); } catch {}
  for (const w of pending) { if (w.data === null) docs.delete(w.c + "/" + w.id); else docs.set(w.c + "/" + w.id, w.data); }
  const collL = {}, docL = {};
  const meta = () => ({ fromCache: !fromServer, hasPendingWrites: pending.length > 0 });
  const snapDoc = (c, id) => { const d = docs.get(c + "/" + id); return { id, exists: !!d, data: () => d, metadata: meta() }; };
  const snapColl = c => { const arr = []; for (const [k, d] of docs) if (k.startsWith(c + "/")) { const id = k.slice(c.length + 1); arr.push({ id, exists: true, data: () => d, metadata: meta() }); } return { docs: arr, size: arr.length, empty: !arr.length, metadata: meta(), docChanges: () => [] }; };

  }
  async function post(body) {
    const r = await fetch(url, { method: "POST", body: JSON.stringify(Object.assign({ token }, body)) });

  }

    const r = await fetch(u + (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(t) + "&action=all&t=" + Date.now());

      add: async d => { const r = docRef(name, "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)); await r.set(d); return r; },
      onSnapshot(cb) { (collL[name] = collL[name] || []).push(cb); setTimeout(() => cb(snapColl(name)), 0); return () => { collL[name] = collL[name].filter(f => f !== cb); }; } }),

    disconnect() { url = ""; token = ""; ["masarif.api", "masarif.token", "masarif.cache", "masarif.pending"].forEach(LS.del); docs = new Map(); pending = []; fromServer = false; },

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const AR = "٠١٢٣٤٥٦٧٨٩";
const norm = s => String(s ?? "").replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/٫/g, ".").replace(/٬/g, ",");
const fmt = n => Math.round(+n || 0).toLocaleString("en-US");
const money = n => "EGP " + fmt(n);
const fmtIn = n => (+n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const numIn = s => parseFloat(norm(s).replace(/[^\d.]/g, "")) || 0;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const toStr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

const todayStr = () => toStr(new Date());
const iso = (y, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= 31) ? y + "-" + pad(m) + "-" + pad(d) : null;
const monthLabel = ym => toDate(ym + "-01").toLocaleDateString("en-GB", {month: "long", year: "numeric"});
const shiftMonth = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + "-" + pad(m); };
const daysDiff = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayLabel = ds => toDate(ds).toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"});

const GROUPS = { need: "Need", want: "Want", debt: "Debt & savings" };
const GROUP_ORDER = { need: 0, want: 1, debt: 2 };
const GROUP_COLOR = { need: "var(--need)", want: "var(--want)", debt: "var(--debt)", none: "var(--none)" };
const PALETTE = ["#10B981", "#0EA5E9", "#F97316", "#EC4899", "#8B5CF6", "#F59E0B", "#14B8A6", "#EF4444", "#84CC16", "#3B82F6", "#D946EF", "#64748B"];
const NONE_COLOR = "#9AA3B2";
const DEFAULT_SETTINGS = { salary: 0, fixed: [], card: { balance: 0, rate: 0.035, payment: 0, asOf: "", asOfTime: "", dueDate: "" }, account: { balance: 0, asOf: "", asOfTime: "" }, dateOrder: "dmy", startDay: 1, cards: [], defaultCardId: "", loan: { balance: 0, rate: 0, payment: 0 }, fuelWeekly: 2000 };

/* ---------- state ---------- */
const S = {
  cats: [], txns: [], settings: null,
  month: null, monthTouched: false, view: "home",
  q: "", filter: "all", scope: "all",
  ready: { c: false, t: false, s: false }, dbOk: null, slow: false, err: null,
  setupDirty: false, importRows: null, importNote: "",
  checks: {}, trendN: 6, cardF: "all", importCard: null,
  goals: [], owed: [], subs: {}, sync: { state: "", msg: "", busy: false, last: null, added: 0 }, planPay: null, calSel: null
};
let db = null;
const settings = () => Object.assign({}, DEFAULT_SETTINGS, S.settings || {}, { card: Object.assign({}, DEFAULT_SETTINGS.card, (S.settings || {}).card || {}), loan: Object.assign({}, DEFAULT_SETTINGS.loan, (S.settings || {}).loan || {}), account: Object.assign({}, DEFAULT_SETTINGS.account, (S.settings || {}).account || {}), sync: Object.assign({}, DEFAULT_SETTINGS.sync, (S.settings || {}).sync || {}) });
const kw = c => String(c.keywords || "").split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
const catById = id => S.cats.find(c => c.id === id);
const groupOf = t => { const c = catById(t.categoryId); return c ? (c.group || "need") : "none"; };
const catColor = c => c ? (c.color || PALETTE[(S.cats.indexOf(c) + PALETTE.length) % PALETTE.length]) : NONE_COLOR;
/* ---------- payment methods ---------- */
const CASH = { id: "cash", name: "Cash", type: "cash", color: "#65A30D" };
const TYPE_COLOR = { credit: "#7C3AED", debit: "#0EA5E9", cash: "#65A30D" };
const TYPE_NAME = { credit: "Credit card", debit: "Debit card", cash: "Cash" };
const numsOf = c => String((c && c.last4) || "").split(/\D+/).filter(x => x.length >= 3);
const cards = () => (settings().cards || []).filter(c => c && c.id).map(c => Object.assign({}, c, { nums: numsOf(c), last4: numsOf(c)[0] || "" }));

const cardById = id => payMethods().find(c => c.id === id) || null;
const creditCard = () => cards().find(c => c.type === "credit") || null;
const cardColor = c => c ? (c.color || TYPE_COLOR[c.type] || "#64748B") : NONE_COLOR;
const cardLabel = c => c ? c.name + (c.last4 ? " ••" + c.last4 : "") : "Card not set";
const INCOME_RE = /إلى حسابك|الى حسابك|لحسابك|to your account|credited to your account|transfer received|received a transfer/i;
const REFUND_RE = /refund|reversal|reversed|cashback|تم رد|رد مبلغ|استرداد|ارجاع|إرجاع|مرتجع/i;
const OTP_RE = /\b(otp|one[- ]time|verification|password|passcode)\b|رمز|كلمة المرور|كود التفعيل/i;

const PAY_RE = /\b(payment received|thank you for your payment|payment of .{0,30} (?:has been )?received|card payment received)\b|تم سداد|سداد مبلغ|تم استلام سداد/i;
function detectCard(text) {
  const t = norm(text);
  if (/\|\s*CASH\s*$/i.test(t.trim())) return "cash";
  for (const c of cards()) for (const l of c.nums) if (new RegExp("(?:^|\\D)" + l + "(?:\\D|$)").test(t)) return c.id;
  return null;
}

/* ---------- periods (month starting on a chosen day) ---------- */
const startDay = () => Math.min(28, Math.max(1, parseInt(settings().startDay, 10) || 1));
const pStart = key => key + "-" + pad(startDay());
const pNext = key => pStart(shiftMonth(key, 1));
const pEndStr = key => { const d = toDate(pNext(key)); d.setDate(d.getDate() - 1); return toStr(d); };
const inP = (date, key) => !!date && date >= pStart(key) && date < pNext(key);
const pKeyOf = date => { const ym = date.slice(0, 7); return +date.slice(8, 10) >= startDay() ? ym : shiftMonth(ym, -1); };
const curKey = () => pKeyOf(todayStr());
function pLabel(key, long) {
  if (startDay() === 1) return monthLabel(key);
  const a = toDate(pStart(key)), b = toDate(pEndStr(key));
  const o = { day: "numeric", month: "short" };
  const yr = long || b.getFullYear() !== new Date().getFullYear() ? " " + b.getFullYear() : "";
  return a.toLocaleDateString("en-GB", o) + " – " + b.toLocaleDateString("en-GB", o) + yr;
}

/* Keywords match the start of a word, so "lab" doesn't match "available" but "fawry" matches "FawryPF". The shop name is checked before the rest of the text. */
const kwRe = k => new RegExp("(^|[^a-z0-9\u0600-\u06ff])" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
function autoCat(text) {
  const parts = String(text || "").split("|");
  const tries = [parts.length > 3 ? parts[2] : "", String(text || "")];
  for (const t of tries) {
    if (!t.trim()) continue;
    let best = null, len = 0;
    for (const c of S.cats) for (const k of kw(c)) if (k.length > len && kwRe(k).test(t)) { best = c.id; len = k.length; }
    if (best) return best;
  }
  return null;
}

/* ---------- parsing ---------- */
function parseAmount(s) { const m = norm(s).replace(/,/g, "").match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : 0; }
function parseDate(s, order) {
  s = norm(s);
  let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return iso(+m[1], +m[2], +m[3]);
  m = s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; const a = +m[1], b = +m[2]; return order === "mdy" ? iso(y, a, b) : iso(y, b, a); }
  const d = new Date(s.replace(/\bat\b/i, " ").replace(/،/g, ","));
  if (!isNaN(d) && d.getFullYear() > 2000) return iso(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return null;
}
function parseTime(s) {
  const m = norm(s).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|ص|م)?/i);
  if (!m) return "";
  let h = +m[1]; const ap = (m[3] || "").toUpperCase();
  if ((ap === "PM" || ap === "م") && h < 12) h += 12;
  if ((ap === "AM" || ap === "ص") && h === 12) h = 0;
  return h < 24 ? pad(h) + ":" + m[2] : "";
}
function detectOrder(lines, fallback) {
  for (const l of lines) { const m = norm(l).match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if (m) { if (+m[1] > 12) return "dmy"; if (+m[2] > 12) return "mdy"; } }
  return fallback;
}
/* Lines written by the "My Wallet" shortcut: date | amount | place */
function parseShortcutFile(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const order = detectOrder(lines, settings().dateOrder);
  const rows = [];
  for (const line of lines) {
    const parts = line.split("|").map(s => s.trim());
    if (parts.length < 2) continue;
    const sms = parts.slice(3).join(" | ").trim();
    if (sms) {
      if (OTP_RE.test(sms)) continue;
      const cardId = detectCard(line);
      if (!cardId && !BANK_RE.test(sms)) continue;
      const amount = amountIn(sms) || parseAmount(parts[1]);
      if (!amount) continue;
      const kind = kindOf(sms);
      rows.push({ id: "s_" + hash(line), date: parseDate(dateIn(sms), "dmy") || parseDate(parts[0], order) || todayStr(), time: parseTime(sms) || parseTime(parts[0]),
        amount, merchant: shopFor(sms, kind, kind === "expense" || kind === "refund" ? parts[2] : ""), raw: line, source: "shortcut", kind, cardId });
      continue;
    }
    const amount = parseAmount(parts[1]);
    if (!amount) continue;
    rows.push({ id: "s_" + hash(line), date: parseDate(parts[0], order) || todayStr(), time: parseTime(parts[0]),
      amount, merchant: (parts[2] || "").trim(), raw: line, source: "shortcut", kind: kindOf(line), cardId: detectCard(line) });
  }
  return rows;
}
const CUR = "(?:EGP|LE|L\\.E\\.?|جنيه|ج\\.م\\.?|جم)";
function amountIn(m) {
  m = norm(m);
  const x = m.match(new RegExp(CUR + "\\s*([\\d,]+(?:\\.\\d+)?)", "i")) || m.match(new RegExp("([\\d,]+(?:\\.\\d+)?)\\s*" + CUR, "i")) || m.match(/([\d,]+\.\d{2})/);
  return x ? parseFloat(x[1].replace(/,/g, "")) : 0;
}
function dateIn(m) { const x = norm(m).match(/\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/); return x ? x[0] : ""; }
function shopFor(m, kind, fallback) {
  const shop = merchantIn(m);
  if (shop) return shop;
  if (kind === "income") { const who = m.match(/من\s+([\u0600-\u06FF ]{2,40}?)\s+(?:برقم|بتاريخ|في)/); return "Transfer from " + (who ? who[1].trim() : "someone"); }
  if (/تحويل|transfer|instapay/i.test(m)) return "InstaPay transfer";
  return fallback || "";
}
function merchantIn(m) {
  let x = m.match(/\b(?:at|from|to)\s+([A-Za-z][A-Za-z0-9 .&'*\-]{1,40}?)(?=\s+(?:on|at|with|using|for|via)\b|[,;\n]|\.\s|$)/i);
  if (x) return x[1].trim();
  x = m.match(/(?:لدى|عند|من|في)\s+([A-Za-z][A-Za-z0-9 .&'*\-]{1,40})/);
  if (x) return x[1].trim();
  x = m.match(/\b(?!EGP\b|Apple\b|Pay\b|CIB\b|Card\b)[A-Za-z][A-Za-z0-9 .&'*\-]*?(?=\W*[^\x00-\x7F])/);
  return x ? x[0].trim() : "";
}
function parseSms(text) {
  let msgs = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  if (msgs.length === 1) { const ls = msgs[0].split(/\n/).map(l => l.trim()).filter(Boolean); if (ls.length > 1 && ls.every(l => amountIn(l))) msgs = ls; }
  const order = detectOrder(msgs, settings().dateOrder);
  return msgs.map(m => {
    const amount = amountIn(m);
    if (!amount) return null;
    if (OTP_RE.test(m)) return null;
    const kind = kindOf(m);
    return { id: "m_" + hash(m), date: parseDate(dateIn(m), order) || todayStr(), time: parseTime(m), amount,
      merchant: shopFor(m, kind), raw: m, source: "sms", kind, cardId: detectCard(m) };
  }).filter(Boolean);
}

/* ---------- numbers ---------- */
const signed = t => isFlow(t) ? 0 : (t.kind === "refund" ? -1 : 1) * (+t.amount || 0);
function activeFixed(key) { return (settings().fixed || []).filter(f => (+f.amount || 0) > 0 && (!f.until || key <= f.until)); }

/* ---------- insights ---------- */
function insights(key, d) {
  const out = [];
  if (!d.tx.length) { out.push({ t: "", x: "No purchases in this month yet. Import your shortcut file or bank texts from the Import tab." }); return out; }
  const nw = d.byGroup.need + d.byGroup.want;
  if (nw > 0) {
    const share = d.byGroup.want / nw;
    if (share >= 0.3) out.push({ t: "warn", x: `Wants are ${Math.round(share * 100)}% of your spending (${money(d.byGroup.want)}). Bringing that under 20% frees about ${money(d.byGroup.want - nw * 0.2)}.` });
    else if (d.byGroup.want > 0) out.push({ t: "good", x: `Wants are only ${Math.round(share * 100)}% of your spending. Keep it there.` });
  }
  const counts = {};
  for (const t of d.tx) { if (groupOf(t) !== "want" || t.kind === "refund") continue; const k = (t.merchant || "").trim().toLowerCase(); if (!k) continue; counts[k] = counts[k] || { n: 0, s: 0, name: t.merchant }; counts[k].n++; counts[k].s += +t.amount || 0; }
  const top = Object.values(counts).filter(c => c.n >= 3).sort((a, b) => b.s - a.s)[0];
  if (top) out.push({ t: "warn", x: `${top.name}: ${top.n} purchases, ${money(top.s)} this month. Halving it saves about ${money(top.s / 2)}.` });
  const cc = creditCard();
  if (cc && (d.byCard[cc.id] || 0) > 0 && cardNow().now > 0) out.push({ t: "warn", x: `You put ${money(d.byCard[cc.id])} on the credit card this month. While you're paying it off, use the debit card or cash so the balance doesn't grow.` });
  if (cc && +cc.limit > 0) { const u = cardNow().now / +cc.limit; if (u >= 0.3) out.push({ t: u >= 0.7 ? "bad" : "warn", x: `You're using ${Math.round(u * 100)}% of your credit limit. Under 30% is healthier for your credit record.` }); }
  const unset = d.tx.filter(t => !isFlow(t) && !cardById(t.cardId)).length;
  if (unset && cards().length) out.push({ t: "", x: `${unset} purchase${unset > 1 ? "s don't" : " doesn't"} say which card paid. Tap them on the Spending tab to set it.` });
  const none = d.tx.filter(t => !isFlow(t) && groupOf(t) === "none").length;
  if (none) out.push({ t: "", x: `${none} purchase${none > 1 ? "s have" : " has"} no category. Give them one so Need and Want stay accurate.` });
  if (key === curKey()) {
    const elapsed = daysDiff(pStart(key), todayStr()) + 1;
    const wantDays = new Set(d.tx.filter(t => groupOf(t) === "want" && t.kind !== "refund" && t.date <= todayStr()).map(t => t.date));
    const free = elapsed - wantDays.size;
    out.push({ t: free >= elapsed / 2 ? "good" : "", x: `${free} of ${elapsed} days this month had no Want spending.` });
  }
  const prev = periodData(shiftMonth(key, -1));
  if (prev.tx.length && prev.spend > 0 && key !== curKey()) {
    const ch = (d.spend - prev.spend) / prev.spend;
    out.push({ t: ch > 0 ? "warn" : "good", x: `Spending was ${Math.abs(Math.round(ch * 100))}% ${ch > 0 ? "higher" : "lower"} than the month before.` });
  }
  return out;
}

    acc += len; return s;

function billsFor(key) {
  const ps = pStart(key), pn = pNext(key), done = (S.checks[key] || {}).bills || {};
  const out = [];
  activeFixed(key).forEach(f => {
    const day = Math.round(+f.day || 0); if (day < 1) return;
    const d = toDate(ps);
    for (let i = 0; i < 32; i++) {
      const ds = toStr(d); if (ds >= pn) break;
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      if (d.getDate() === Math.min(day, last)) { out.push({ id: f.name, name: f.name, amount: +f.amount || 0, date: ds, paid: !!done[f.name] }); break; }
      d.setDate(d.getDate() + 1);
    }
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

function renderTxList() {
  const box = $("#txList"); if (!box) return;

  if (S.scope === "period") tx = tx.filter(t => inP(t.date, S.month));
  if (S.filter !== "all") tx = tx.filter(t => !isFlow(t) && groupOf(t) === S.filter);
  if (S.cardF === "pay") tx = tx.filter(t => t.kind === "payment");
  else if (S.cardF === "_none") tx = tx.filter(t => !isFlow(t) && !cardById(t.cardId));
  else if (S.cardF !== "all") tx = tx.filter(t => !isFlow(t) && t.cardId === S.cardF);
  if (q) tx = tx.filter(t => [t.merchant, t.note, String(t.amount), (catById(t.categoryId) || {}).name].join(" ").toLowerCase().includes(q));
  tx.sort(txSort);

async function doImport() {
  const rows = (S.importRows || []).filter(r => r.pick && !r.exists);
  const btn = $("#doImport"), msg = $("#impMsg");
  btn.disabled = true;
  let done = 0, failed = 0;
  const queue = rows.slice();
  const worker = async () => {
    while (queue.length) {
      const r = queue.shift();
      try {
        await db.collection("transactions").doc(r.id).set({ date: r.date, time: r.time || "", amount: r.amount, kind: r.kind || "expense",
          merchant: r.merchant || (r.kind === "payment" ? "Credit card payment" : ""), note: "", categoryId: r.categoryId || null, cardId: r.cardId || null, source: r.source, raw: r.raw || "", createdAt: Date.now() });
        done++;
      } catch (e) { failed++; if (e && e.code === "quota_exceeded") queue.length = 0; }
      if (msg) msg.textContent = `Saving ${done + failed} of ${rows.length}…`;
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  S.importRows = null; S.importNote = "";
  const box = $("#importPrev");
  if (box) {
    const ls = limitStatus(periodData(curKey()));
    box.innerHTML = `<div class="note ok">Imported ${done} purchase${done === 1 ? "" : "s"}.${failed ? ` ${failed} couldn't be saved; try importing again.` : ""} <a href="#txns" style="font-weight:700">See them</a></div>
      ${ls.over.length ? `<div class="alert" role="alert"><h2>Over the limit this month</h2>${ls.over.map(x => `<div class="ln"><span>${esc(x.c.name)}</span><span class="num"><b>${fmt(x.s)}</b> / ${fmt(x.lim)}</span></div>`).join("")}</div>` : ""}`;
  }
}

    const ds = $("#sDefCard"), cur = ds.dataset.v ?? (settings().defaultCardId || "");

    ds.onchange = () => { ds.dataset.v = ds.value; S.setupDirty = true; };
  };
  drawCfg();
  const cfgInput = el => {
    const i = +el.dataset.ci, k = el.dataset.ck; let v = el.value;

    if (k === "limit") v = numIn(v);
    cfg[i][k] = v;
    if (k === "type") { cfg[i].color = ""; drawCfg(); return; }
    if (k === "limit") { /* face updates below */ }

  form.oninput = e => {

    if (["cBal", "cRate", "cPay"].includes(el.id)) drawCard();

  form.onchange = form.oninput;

      card: Object.assign({}, st.card, { balance: numIn($("#cBal").value), rate: numIn($("#cRate").value) / 100, payment: numIn($("#cPay").value), asOf: $("#cAsOf").value || "", asOfTime: ($("#cAsOf").value || "") === st.card.asOf && numIn($("#cBal").value) === +st.card.balance ? (st.card.asOfTime || "") : "" }),
      dateOrder: $("#sOrder").value
    });
    m.textContent = "Saving…";
    try {
      const changed = newStart !== startDay();
      await db.doc("settings/main").set(doc);
      S.settings = doc;
      if (changed) { S.monthTouched = false; S.month = curKey(); }
      S.setupDirty = false; m.textContent = "Saved";
      if (changed) render(true);
    } catch (err) { m.textContent = "Couldn't save. Try again."; }
  };
  $("#reloadAll").onclick = () => refresh(true);
  $("#discon").onclick = e => { const b = e.currentTarget; if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap again to disconnect"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "Disconnect this phone"; }, 3000); return; } Store.disconnect(); location.hash = ""; location.reload(); };
  $("#copyCsv").onclick = async () => {
    const rows = [["date", "time", "amount", "type", "shop", "category", "group", "note", "source"]];
    for (const t of [...S.txns].filter(t => !t.deleted && t.date).sort((a, b) => a.date.localeCompare(b.date))) {
      const c = catById(t.categoryId);
      rows.push([t.date, t.time || "", t.amount, t.kind || "expense", t.merchant || "", c ? c.name : "", c ? GROUPS[c.group || "need"] : "", t.note || "", t.source || ""]);
    }
    const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v)).join(",")).join("\n");
    try { await navigator.clipboard.writeText(csv); $("#csvMsg").textContent = `Copied ${rows.length - 1} purchases`; }
    catch { const ta = $("#csvOut"); ta.hidden = false; ta.value = csv; ta.select(); $("#csvMsg").textContent = "Select all and copy the text below"; }
  };
}

/* ---------- sheets ---------- */
const wrap = $("#sheetWrap"), sheet = $("#sheet");
function openSheet(html) { sheet.innerHTML = `<div class="grip"></div>` + html; wrap.hidden = false; document.body.style.overflow = "hidden"; }
function closeSheet() { wrap.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = ""; }
wrap.addEventListener("click", e => { if (e.target === wrap) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !wrap.hidden) closeSheet(); });
function catOptions(sel) {
  return `<option value="">No category</option>` + ["need", "want", "debt"].map(g => {
    const list = S.cats.filter(c => (c.group || "need") === g);
    return list.length ? `<optgroup label="${GROUPS[g]}">${list.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</optgroup>` : "";
  }).join("");
}
function armDelete(btn, fn) {
  btn.onclick = () => {
    if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Tap again to delete"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Delete"; }, 3000); return; }
    fn();
  };
}

  const payChips = payMethods().map(c => `<label class="paychip" style="--c:${cardColor(c)}"><input type="radio" name="tpay" value="${esc(c.id)}" ${c.id === v.cardId ? "checked" : ""}>

  openSheet(`<div class="row"><h2>${t ? (t.kind === "payment" ? "Edit card payment" : "Edit purchase") : v.kind === "payment" ? "Record a card payment" : "Add a purchase"}</h2><button class="x" type="button" id="xClose" aria-label="Close">×</button></div>
    <form id="txForm" class="txf">
      <div class="kinds" role="radiogroup" aria-label="Type">${KINDS.map(([k, label, ic]) => `<label class="kind k-${k}"><input type="radio" name="kind" value="${k}" ${(v.kind || "expense") === k ? "checked" : ""}><span class="k-ic" aria-hidden="true">${ic}</span><span>${label}</span></label>`).join("")}</div>
      <label class="amt-box"><span class="sr">Amount in EGP</span><span class="amt-cur">EGP</span><input type="text" inputmode="decimal" id="tAmt" value="${v.amount ? esc(fmtIn(v.amount)) : ""}" placeholder="0" autocomplete="off" required></label>
      <label class="field"><span>Shop or description</span><input type="text" id="tMer" value="${esc(v.merchant)}" placeholder="e.g. Carrefour, cash for taxi" autocomplete="off"></label>
      <div class="field" id="tCatWrap"><span>Category</span><div class="chips" id="tCats">${catChips}</div></div>
      <label class="check" id="rememberBox" ${v.merchant ? "" : "hidden"}><input type="checkbox" id="tRem"><span>Always put <b id="remName">${esc(v.merchant)}</b> in this category</span></label>
      <div class="field" id="tPayWrap"><span>Paid with</span><div class="paychips">${payChips}</div></div>
      <div class="dt-row">
        <label class="field"><span>Date</span><input type="date" id="tDate" value="${esc(v.date)}" required></label>
        <label class="field"><span>Time</span><input type="time" id="tTime" value="${esc(v.time || "")}"></label>
      </div>
      <label class="field"><span>Note (optional)</span><input type="text" id="tNote" value="${esc(v.note || "")}" placeholder="Anything to remember"></label>
      ${t && t.raw ? `<details><summary class="small muted">Original ${t.source === "shortcut" ? "shortcut line" : "bank text"}</summary><div class="raw">${esc(t.raw)}</div></details>` : ""}
      <div class="sheet-actions">${t ? `<button class="btn danger" type="button" id="tDel">Delete</button>` : ""}<button class="btn grad big" type="submit" ${S.dbOk ? "" : "disabled"}>Save</button></div>
      <div class="small muted" id="tMsg" style="text-align:center"></div>
    </form>`);
  $("#xClose").onclick = closeSheet;
  const kindNow = () => sheet.querySelector("input[name=kind]:checked").value;
  const catVal = () => { const r = sheet.querySelector("input[name=tcat]:checked"); return r ? r.value : ""; };
  const payVal = () => { const r = sheet.querySelector("input[name=tpay]:checked"); return r ? r.value : ""; };
  let catTouched = !!v.categoryId;
  $("#tCats").onchange = () => { catTouched = true; };
  const amt = $("#tAmt");
  amt.addEventListener("blur", () => { if (amt.value.trim()) amt.value = fmtIn(numIn(amt.value)); });
  $("#tMer").oninput = e => {
    const val = e.target.value.trim();
    $("#rememberBox").hidden = !val || kindNow() === "payment" || kindNow() === "income"; $("#remName").textContent = val;
    if (!catTouched) { const id = autoCat(val) || ""; const r = sheet.querySelector(`input[name=tcat][value="${CSS.escape(id)}"]`); if (r) r.checked = true; }
  };
  const syncKind = () => { const k = kindNow(); sheet.querySelector(".txf").dataset.kind = k; $("#tCatWrap").hidden = k === "payment" || k === "income"; $("#tPayWrap").hidden = k === "payment"; if (k === "payment" || k === "income") $("#rememberBox").hidden = true; else $("#rememberBox").hidden = !$("#tMer").value.trim(); };
  sheet.querySelectorAll("input[name=kind]").forEach(r => r.onchange = syncKind); syncKind();
  if (!t) setTimeout(() => { try { amt.focus(); } catch {} }, 250);
  $("#txForm").onsubmit = async e => {
    e.preventDefault();
    const amount = numIn($("#tAmt").value);
    if (!(amount > 0)) { $("#tMsg").textContent = "Enter an amount above zero."; return; }
    const data = { date: $("#tDate").value, time: $("#tTime").value || "", amount, kind: sheet.querySelector("input[name=kind]:checked").value,
      merchant: $("#tMer").value.trim(), note: $("#tNote").value.trim(), categoryId: catVal() || null, cardId: payVal() || null };
    if (data.kind === "income") { data.categoryId = null; if (!data.merchant) data.merchant = "Money received"; }
    if (data.kind === "payment") { data.categoryId = null; data.cardId = (creditCard() || {}).id || null; if (!data.merchant) data.merchant = "Credit card payment"; }
    $("#tMsg").textContent = "Saving…";
    try {
      if (t) await db.collection("transactions").doc(t.id).update(data);
      else await db.collection("transactions").doc("x_" + uid()).set(Object.assign(data, { source: "manual", raw: "", createdAt: Date.now() }));
      if ($("#tRem") && $("#tRem").checked && data.categoryId && data.merchant) {
        const c = catById(data.categoryId), k = data.merchant.toLowerCase();
        if (c && !kw(c).includes(k)) await db.collection("categories").doc(c.id).update({ keywords: kw(c).concat(k).join(", ") });
      }
      closeSheet();
    } catch (err) { $("#tMsg").textContent = "Couldn't save. Try again."; }
  };
  if (t) armDelete($("#tDel"), async () => {
    try {
      if (t.source === "manual") await db.collection("transactions").doc(t.id).delete();
      else await db.collection("transactions").doc(t.id).update({ deleted: true });
      closeSheet();
    } catch { $("#tMsg").textContent = "Couldn't delete. Try again."; }
  });
}
function openCat(id) {
  const c = id ? catById(id) : null;
  const v = c || { name: "", group: "want", budget: "", keywords: "" };
  const cur = c ? catColor(c) : PALETTE[S.cats.length % PALETTE.length];
  openSheet(`<div class="row"><h2>${c ? "Edit category" : "New category"}</h2><button class="x" type="button" id="xClose" aria-label="Close">×</button></div>
    <form id="catForm" style="display:flex;flex-direction:column;gap:12px">
      <label class="field"><span>Name</span><input type="text" id="cName" value="${esc(v.name)}" required></label>
      <div class="field"><span>Type</span><div class="seg" role="radiogroup" aria-label="Type">
        ${["need", "want", "debt"].map(g => `<label><input type="radio" name="grp" value="${g}" ${(v.group || "need") === g ? "checked" : ""}>${GROUPS[g]}</label>`).join("")}
      </div></div>
      <div class="field"><span>Color</span><div class="swatches" role="radiogroup" aria-label="Color">
        ${PALETTE.map(p => `<label style="--c:${p}"><input type="radio" name="col" value="${p}" ${p.toLowerCase() === String(cur).toLowerCase() ? "checked" : ""} aria-label="${p}"></label>`).join("")}
      </div></div>
      <div class="grid2">
        <label class="field"><span>Monthly limit (optional)</span><div class="affix"><input type="number" inputmode="decimal" id="cBud" value="${esc(v.budget || "")}" step="any" min="0"><span>EGP</span></div></label>
        <label class="field"><span>Weekly limit (optional)</span><div class="affix"><input type="number" inputmode="decimal" id="cWk" value="${esc(v.weekly || "")}" step="any" min="0"><span>EGP</span></div></label>
      </div>
      <label class="field"><span>Keywords, separated by commas</span><textarea id="cKw" placeholder="carrefour, spinneys, seoudi">${esc(v.keywords || "")}</textarea></label>
      ${c ? `<label class="check"><input type="checkbox" id="cRe"><span>Also move uncategorized purchases that match these keywords</span></label>` : ""}
      <div class="btns"><button class="btn grad" type="submit" ${S.dbOk ? "" : "disabled"}>Save</button>${c ? `<button class="btn danger" type="button" id="cDel">Delete</button>` : ""}</div>
      <div class="small muted" id="cMsg"></div>
    </form>`);
  $("#xClose").onclick = closeSheet;
  $("#catForm").onsubmit = async e => {
    e.preventDefault();
    const colEl = sheet.querySelector("input[name=col]:checked");
    const data = { name: $("#cName").value.trim(), group: sheet.querySelector("input[name=grp]:checked").value, budget: +$("#cBud").value || 0, weekly: +$("#cWk").value || 0,
      color: colEl ? colEl.value : cur,
      keywords: $("#cKw").value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean).join(", ") };
    if (!data.name) { $("#cMsg").textContent = "Give the category a name."; return; }
    $("#cMsg").textContent = "Saving…";
    try {
      const cid = c ? c.id : "c_" + uid();
      if (c) await db.collection("categories").doc(cid).update(data);
      else await db.collection("categories").doc(cid).set(Object.assign(data, { order: S.cats.length }));
      if ((!c || ($("#cRe") && $("#cRe").checked)) && data.keywords) {
        const keys = data.keywords.split(",").map(s => s.trim()).filter(Boolean);
        const hits = S.txns.filter(t => !t.deleted && !catById(t.categoryId) && keys.some(k => ((t.merchant || "") + " " + (t.raw || "")).toLowerCase().includes(k)));
        for (const t of hits) await db.collection("transactions").doc(t.id).update({ categoryId: cid });
      }
      closeSheet();
    } catch { $("#cMsg").textContent = "Couldn't save. Try again."; }
  };
  if (c) armDelete($("#cDel"), async () => {
    try { await db.collection("categories").doc(c.id).delete(); closeSheet(); }
    catch { $("#cMsg").textContent = "Couldn't delete. Try again."; }
  });
}

/* ---------- Ask Claude (copies your month and opens the Claude app) ---------- */
async function askClaude(d) {
  const out = $("#askOut");
  const st = settings();
  const cats = S.cats.map(c => ({ name: c.name, type: GROUPS[c.group || "need"], limit: +c.budget || 0, spent: Math.round(d.byCat[c.id] || 0) })).filter(c => c.spent || c.limit);
  const merchants = {};
  for (const t of d.tx) { if (t.kind !== "expense") continue; const k = t.merchant || "Unknown"; merchants[k] = merchants[k] || { count: 0, total: 0 }; merchants[k].count++; merchants[k].total += +t.amount || 0; }
  const topM = Object.entries(merchants).sort((a, b) => b[1].total - a[1].total).slice(0, 12).map(([name, v]) => ({ name, count: v.count, total: Math.round(v.total) }));
  const isCur = S.month === curKey();
  const summary = { period: pLabel(S.month, true), today: todayStr(), daysLeftInPeriod: isCur ? daysDiff(todayStr(), pNext(S.month)) : 0,
    salary: d.salary, fixedPayments: d.fixed.map(f => ({ name: f.name, amount: +f.amount, until: f.until || null })),
    spentSoFar: Math.round(d.total), need: Math.round(d.byGroup.need), want: Math.round(d.byGroup.want), uncategorized: Math.round(d.byGroup.none),
    leftThisMonth: Math.round(d.left), categories: cats, topShops: topM,
    spentByCard: payMethods().map(c => ({ card: cardLabel(c), spent: Math.round(d.byCard[c.id] || 0) })).filter(x => x.spent),
    creditCard: { owedNow: Math.round(cardNow().now), monthlyInterestRate: +st.card.rate, plannedMonthlyPayment: +st.card.payment } };
  const prompt = `I live in Egypt and I'm cutting my spending to pay off my credit card quickly. Amounts are in Egyptian pounds (EGP). My month runs from payday to payday. Here is this month so far, from my Masarif app:\n\n${JSON.stringify(summary, null, 1)}\n\nGive me 5 specific, practical actions for the rest of this month based on these numbers, each naming the category or shop and roughly how many EGP it would save. Then one line on how much faster the card could be paid off if I put those savings on it.`;
  let copied = false;
  try { await navigator.clipboard.writeText(prompt); copied = true; } catch {}
  out.hidden = false;
  if (copied) {
    out.innerHTML = `<b>Your month is copied.</b> Open Claude, paste it in a new chat, and send.<div class="btns" style="margin-top:10px"><a class="btn grad" href="https://claude.ai/new" style="text-decoration:none">Open Claude</a></div>`;
  } else {
    out.innerHTML = `<b>Copy this, then paste it into Claude:</b><textarea readonly style="margin-top:8px;min-height:140px"></textarea><div class="btns" style="margin-top:10px"><a class="btn grad" href="https://claude.ai/new" style="text-decoration:none">Open Claude</a></div>`;
    const ta = out.querySelector("textarea"); ta.value = prompt; ta.select();
  }
}

/* ---------- routing & boot ---------- */
const VIEWS = ["home", "txns", "plan", "cats", "import", "setup"];
function route() { const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : "home"; }
window.addEventListener("hashchange", () => { route(); closeSheet(); render(true); window.scrollTo(0, 0); });
$("#mPrev").onclick = () => { S.monthTouched = true; S.month = shiftMonth(S.month, -1); render(true); };
$("#mNext").onclick = () => { S.monthTouched = true; S.month = shiftMonth(S.month, 1); render(true); };
$("#fab").onclick = () => openTx(null);

window.__onStore = () => { if (S.view === "import") render(true); else { const el = document.getElementById("syncSt"); if (el) el.querySelector("span").textContent = syncText(); } };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(false); });
window.addEventListener("online", () => { Store.flush(); refresh(true); });

function renderConnect(msg) {
  document.querySelector("nav.tabs").hidden = true; $("#fab").hidden = true; $("#monthBox").hidden = true;
  main.innerHTML = `<section class="view" style="padding-top:20px">
    <div class="hero" style="text-align:left">
      <div class="label">Welcome</div>
      <div style="font:800 30px/1.1 var(--f-display)">Connect Masarif to your Google Sheet</div>
      <div class="sub">Your purchases, categories and settings are stored in your own Masarif Inbox sheet. Only someone with your script link and secret word can open them.</div>
    </div>
    <form id="conForm" class="card stack">
      <label class="field"><span>Google script link (ends in /exec)</span><input type="text" inputmode="url" id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" required></label>
      <label class="field"><span>Secret word</span><input type="text" id="cTok" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <div class="btns"><button class="btn grad" type="submit" id="cGo">Connect</button></div>
      <div class="small ${msg ? "badtxt" : "muted"}" id="cMsg">${esc(msg || "Both are in the Apps Script you set up from the install guide.")}</div>
    </form>
  </section>`;
  $("#conForm").onsubmit = async e => {
    e.preventDefault();
    const u = $("#cUrl").value.trim(), t = $("#cTok").value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)) { $("#cMsg").textContent = "That doesn't look like a Google script link. Copy the Web app URL that ends in /exec."; $("#cMsg").className = "small badtxt"; return; }
    $("#cGo").disabled = true; $("#cMsg").className = "small muted"; $("#cMsg").textContent = "Checking…";
    let ok = false; try { ok = await Store.test(u, t); } catch {}
    if (!ok) { $("#cGo").disabled = false; $("#cMsg").className = "small badtxt"; $("#cMsg").textContent = "Couldn't connect. Check the link and that the secret word matches the one in your script exactly."; return; }
    Store.connect(u, t);
    document.querySelector("nav.tabs").hidden = false;
    start();
  };
}

let started = false;
function start() {
  if (started) { refresh(true); return; }
  started = true;
  db = Store.db; S.dbOk = true;
  route(); render(true);
  const timer = setTimeout(() => { if (!loaded()) { S.slow = true; render(); } }, 10000);
  const check = () => { if (loaded()) { clearTimeout(timer); S.slow = false; } };
  db.collection("categories").onSnapshot(snap => {
    S.cats = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (GROUP_ORDER[a.group] ?? 9) - (GROUP_ORDER[b.group] ?? 9) || (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(String(b.name)));
    if (!snap.metadata.fromCache) S.ready.c = true; check(); render();
  });
  db.collection("transactions").onSnapshot(snap => {
    S.txns = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (!snap.metadata.fromCache) S.ready.t = true; check(); render();
  });
  const coll = (name, fn) => db.collection(name).onSnapshot(snap => { fn(snap); if (S.view === "plan" || S.view === "home") render(); });
  coll("goals", snap => { S.goals = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); });
  coll("owed", snap => { S.owed = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); });
  coll("subs", snap => { S.subs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); });
  /* ids are saved as "m_2026-10" so Google Sheets keeps them as text instead of turning them into dates */
  coll("checks", snap => { S.checks = Object.fromEntries(snap.docs.filter(d => /^m_\d{4}-\d{2}$/.test(d.id)).map(d => [d.id.slice(2), d.data()])); });
  db.doc("settings/main").onSnapshot(snap => {
    const before = startDay();
    S.settings = snap.exists ? snap.data() : null;
    if (!S.monthTouched || startDay() !== before) S.month = curKey();
    if (!snap.metadata.fromCache) S.ready.s = true; check(); render();
  });
  refresh(true);
}
function boot() {
  route();
  if (!Store.configured()) { renderConnect(); return; }
  start();
}
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
boot();
})();
</script>
