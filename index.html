<style>
/* Layout: one white mobile column, sticky period bar on top, fixed tab bar at the bottom, edit forms in a bottom sheet.
   Single bright white look by design; each category carries its own color. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F6F7FB; --sunk:#EEF1F6; --ink:#151827; --muted:#5B6475; --line:#E8EBF2;
  --accent:#0A8060; --on-accent:#FFFFFF;
  --hero:linear-gradient(135deg,#0F9D74 0%,#14B8A6 52%,#0EA5E9 100%);
  --need:#10B981; --want:#F97316; --debt:#6366F1; --none:#9AA3B2;
  --bad:#E5484D; --warn:#F59E0B; --good:#10B981; --accent-ink:#047857; --bad-ink:#B91C1C; --good-ink:#047857; --warn-ink:#B45309;
  --shadow:0 1px 2px rgba(21,24,39,.05),0 10px 30px rgba(21,24,39,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}


/* ---------- round 2 ---------- */
nav.tabs .in{grid-template-columns:repeat(5,1fr)!important;align-items:center}
.nav-add{justify-self:center;width:52px;height:52px;border-radius:18px;border:0;background:var(--hero);color:#fff;box-shadow:0 8px 20px rgba(14,165,233,.35);display:grid;place-items:center;margin-top:-18px}
.nav-add span{font:700 30px/1 var(--f-display);margin-top:-2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;background:#151827;color:#fff;border-radius:14px;padding:11px 14px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:15px;transition:.2s;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#5EEAD4;font-weight:800}
.hero.h-good{background:linear-gradient(135deg,#0F9D74 0%,#14B8A6 52%,#0EA5E9 100%)}
.hero.h-warn{background:linear-gradient(135deg,#D97706 0%,#F59E0B 55%,#FBBF24 100%);box-shadow:0 14px 34px rgba(245,158,11,.28)}
.hero.h-bad{background:linear-gradient(135deg,#BE123C 0%,#E5484D 55%,#F97316 100%);box-shadow:0 14px 34px rgba(229,72,77,.28)}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.hero-tag i{width:8px;height:8px;border-radius:50%;background:#fff}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;opacity:.92}
.countdown{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit;background:linear-gradient(135deg,#EEF2FF,#F5F3FF);border:1px solid #E0E7FF;border-radius:var(--r);padding:12px 14px}
.cd-num{min-width:58px;height:58px;border-radius:16px;background:linear-gradient(150deg,#6D28D9,#4338CA);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 22px/1 var(--f-display)}
.cd-num small{font:700 12px var(--f-body);opacity:.85;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.countdown.done .cd-num{background:var(--good)}.countdown.bad .cd-num{background:var(--bad)}
.countdown b{font:800 15px var(--f-display);display:block}
.cd-mid{display:flex;flex-direction:column;gap:3px;min-width:0}
.cd-mid > span{font-size:13px;color:var(--muted)}
.cd-bar{display:block;height:6px;border-radius:999px;background:#DDD6FE;overflow:hidden;margin-top:3px}
.cd-bar i{display:block;height:100%;background:linear-gradient(90deg,#6D28D9,#10B981);border-radius:999px}
.cd-bar.dark{background:var(--sunk)}
.cd-chev{font-size:22px;color:#6D28D9}
.actions{display:flex;flex-direction:column;gap:10px}
.act{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);color:inherit}
.act > span:last-child{display:flex;flex-direction:column}
.act b{font-weight:800}.act span span{font-size:13px;color:var(--muted)}
.act-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#E0F2FE;color:#0369A1;font:800 20px var(--f-display);flex:0 0 auto}
.act.payday{background:linear-gradient(135deg,#FEF3C7,#FFFBEB);border-color:#FDE68A}
.act.payday .act-ic{background:#F59E0B;color:#fff}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 13px;border-left:4px solid var(--c);color:inherit}
.qchip b{font-size:13px}.qchip span{font-size:12px;color:var(--muted)}
.qchip.edit{justify-content:center;border-left-width:1px;color:var(--accent);font-weight:800;font-size:13px}
.leftover{background:linear-gradient(135deg,#ECFDF5,#F0FDFA);border-color:#A7F3D0;display:flex;flex-direction:column;gap:12px}
.lo-top{display:flex;gap:12px}.lo-top b{display:block;font:800 17px var(--f-display)}.lo-top span span,.lo-top div > span{font-size:13px;color:var(--muted)}
.lo-ic{width:40px;height:40px;border-radius:12px;background:#10B981;color:#fff;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.streak{font-size:12px;font-weight:800;color:#C2410C;background:#FFEDD5;border-radius:999px;padding:2px 8px}
.verdict{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;text-align:center}
.verdict b{font:800 20px var(--f-display)}
.v-good{background:#ECFDF5;color:#065F46}.v-warn{background:#FFFBEB;color:#92400E}.v-bad{background:#FEF2F2;color:#991B1B}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.vlist li{position:relative;padding:9px 12px 9px 30px;border-radius:12px;background:var(--soft);font-size:15px}
.vlist li::before{content:"";position:absolute;left:12px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--good)}
.vlist li.warn::before{background:var(--warn)}.vlist li.bad::before{background:var(--bad)}
.pd{display:flex;flex-direction:column;gap:14px}
.pd-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.pd-step .stack{gap:6px}
.pd-n{width:28px;height:28px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.inline-num{display:inline-block;width:96px!important;padding:4px 8px!important;min-height:0!important;margin:0 4px}
.pd-score{display:flex;gap:12px;align-items:center;font-size:15px}
.score-ring{--s:0;flex:0 0 auto;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(closest-side,#fff 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--s)*1%),var(--sunk) 0)}
.score-ring b{font:800 30px/1 var(--f-display)}.score-ring small{font-size:12px;color:var(--muted);text-align:center}
.score-ring.sm{width:56px;height:56px}.score-ring.sm b{font-size:20px}
.score-card{display:flex;flex-direction:column;gap:14px}
.sc-top{display:flex;gap:16px;align-items:center}.sc-top > div{display:flex;flex-direction:column;gap:2px}
.sc-word{font:800 22px var(--f-display)}
.sc-parts{display:flex;flex-direction:column;gap:9px}
.sc-parts > div{display:grid;grid-template-columns:1fr 70px 46px;gap:10px;align-items:center;font-size:13px}
.sc-parts em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.sc-parts b{text-align:right;font-size:13px}
.sc-bar{height:7px;border-radius:999px;background:var(--sunk);overflow:hidden}.sc-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.level{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;background:var(--soft);border-radius:14px;padding:12px}
.lv-n{grid-row:span 2;background:linear-gradient(150deg,#6D28D9,#4338CA);color:#fff;border-radius:12px;padding:8px 10px;font-weight:800;font-size:12px;text-align:center}
.level b{font:800 17px var(--f-display)}.level .cd-bar{grid-column:1/-1;margin-top:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:10px 6px;border-radius:14px;background:var(--soft);opacity:.55;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;background:linear-gradient(160deg,#FEF3C7,#FFF7ED)}
.b-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:800;font-size:15px;color:#B45309;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.badge b{font-size:13px}.badge span:last-child{font-size:12px;color:var(--muted);line-height:1.25}
.heat{display:grid;grid-template-columns:34px repeat(4,1fr);gap:4px;font-size:12px}
.heat .hh{text-align:center;color:var(--muted);font-weight:700}.heat .hd{color:var(--muted);font-weight:700;align-self:center}
.hc{height:30px;border-radius:7px;background:color-mix(in srgb,#F97316 calc(var(--a)*100%),var(--soft));display:grid;place-items:center;font-weight:800;color:#431407;font-size:12px}
.pt-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft)}
.pt-row > span:first-child{display:flex;flex-direction:column;min-width:0}.pt-row > span:first-child span{font-size:13px;color:var(--muted)}
.up-tag{font-size:12px;font-weight:800;color:#B91C1C;background:#FEE2E2;border-radius:999px;padding:1px 7px;margin-left:4px}
.pp-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0}
.pp-av{width:32px;height:32px;border-radius:50%;background:#E0E7FF;color:#4338CA;display:grid;place-items:center;font-weight:800}
.card.year{border:0;color:#fff;background:linear-gradient(150deg,#0F172A,#1E293B 60%,#334155);display:flex;flex-direction:column;gap:6px}
.year .label{color:rgba(255,255,255,.75)}
.yr-big{font:800 34px/1.1 var(--f-display)}.yr-big small{font-size:.42em;opacity:.7;margin-right:5px}
.yr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.yr-grid > div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.yr-grid span{font-size:12px;opacity:.7}.yr-grid b{font-size:13px;display:flex;justify-content:space-between;gap:6px}.yr-grid em{font-style:normal;opacity:.75}
.ask{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#F0F9FF,#ECFEFF);border-color:#BAE6FD}
.ask-in{display:flex;gap:8px}.ask-in input{flex:1;min-width:0}
.chips.sm{gap:6px}
.chip-q{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ink)}
.ask-ans{display:flex;flex-direction:column;gap:8px}
.claude-note{background:linear-gradient(135deg,#FFF7ED,#FFFBEB);border-color:#FED7AA;display:flex;flex-direction:column;gap:10px}
.claude-note p{margin:4px 0 0;font-size:15px}
.cn-ic{color:#D97706;font-size:20px}
.yc-total{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px}
.yc-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;color:inherit}
.yc-row .mid{display:flex;flex-direction:column;min-width:0}.yc-row .mid span{font-size:13px;color:var(--muted)}
.yc-p{font-weight:800;color:var(--accent);align-self:center}
.wi-q{font-size:15px;line-height:1.9}
.wi-q select{display:inline-block;width:auto;max-width:100%;padding:6px 10px;margin-left:4px}
.m-list{padding:6px}
.m-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 10px;border-radius:12px;color:inherit;text-decoration:none}
.m-row + .m-row{border-top:1px solid var(--line)}
.m-row .mid{display:flex;flex-direction:column;min-width:0}.m-row .mid span{font-size:13px;color:var(--muted)}
.m-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:800}
.pot-ic{background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 55%,#000)}
.m-row .chev{color:var(--muted);font-size:20px}
.split-box{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:14px;padding:10px}
.split-row{display:grid;grid-template-columns:1fr 120px auto;gap:6px;align-items:center}
.split-row select{min-width:0}
.fuel-econ{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.fuel-econ > span{font-size:13px;color:var(--muted)}
.fuel-econ .btn{align-self:flex-start}


.top-r{display:flex;align-items:center;gap:8px}
.hdr-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.hdr-btn.on{background:color-mix(in srgb,var(--accent) 12%,#fff);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,#fff)}
.page-h{font:800 26px var(--f-display);margin:0;letter-spacing:-.01em}
.qa{display:flex;flex-direction:column;gap:12px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qgrid.scroll{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 2px}.qgrid.scroll::-webkit-scrollbar{display:none}.qgrid.scroll .qtile{flex:0 0 76px}
.qtile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;border-radius:16px;border:1px solid var(--line);background:#fff;color:inherit;min-width:0;transition:transform .1s}
.qtile:active{transform:scale(.96)}
.q-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 55%,#000);font:800 17px var(--f-display);margin-bottom:2px}
.qtile b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qtile > span:last-child{font-size:12px;color:var(--muted)}
.afford-btn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:0;border-radius:14px;padding:11px 12px;background:var(--soft);color:inherit}
.afford-btn > span:nth-child(2){display:flex;flex-direction:column}.afford-btn b{font-weight:800}.afford-btn span span{font-size:13px;color:var(--muted)}
.afford-btn .chev,.act .chev{color:var(--muted);font-size:20px}
.act.payday{display:grid;grid-template-columns:auto 1fr auto}
.heads{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;border-color:#F8C9CB;background:#FFF5F5}
.heads h2{font-size:17px;display:flex;align-items:center;gap:8px}
.h-dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px #FEE2E2}
.heads .ln{display:flex;justify-content:space-between;align-items:center;font-size:15px;width:100%;border:0;background:none;padding:8px 0;min-height:40px;color:inherit;text-align:left}.heads em{font-style:normal;color:var(--muted);font-size:13px}.heads .ln b{color:var(--bad-ink)}
.heads .chev{color:var(--muted);font-size:20px}
.bills-done{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;color:inherit;width:100%}
.bills-done .mid{display:flex;flex-direction:column;min-width:0}.bills-done .mid span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-ic{width:36px;height:36px;border-radius:50%;background:#D1FAE5;color:#047857;display:grid;place-items:center;font-weight:800}
.bills-done .chev{color:var(--muted);font-size:20px}


a,a.link,.link-btn{color:var(--accent-ink)}
.link-btn.danger-t{color:var(--bad-ink)}
.legend > span,.leg div{color:var(--ink)}
.btn{min-height:44px}
.seg label,.seg button{min-height:38px;display:flex;align-items:center;justify-content:center}
.chip-q{min-height:38px;border-radius:12px}
.month button{width:34px;height:34px}
.bill-tg{min-height:36px;padding:6px 12px}
.hero.h-good{background:linear-gradient(135deg,#047857 0%,#0F766E 55%,#0369A1 100%)}
.hero.h-warn{background:linear-gradient(135deg,#9A3412 0%,#B45309 55%,#C2410C 100%);box-shadow:0 14px 34px rgba(180,83,9,.28)}
.hero.h-bad{background:linear-gradient(135deg,#881337 0%,#B91C1C 55%,#C2410C 100%);box-shadow:0 14px 34px rgba(185,28,28,.28)}
.pill .num.word{font-size:15px;line-height:1.35}
.pay-dot{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pay-dot i{width:8px;height:8px;border-radius:50%;background:var(--p);display:inline-block}
.tx{padding:10px 12px}.tx + .tx{margin-top:6px}
.lim-row{display:block;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit}
.lim-row .row b::after{content:" ›";color:var(--muted);font-weight:600}
.older{width:100%;margin-top:6px}
.tools-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;color:inherit;min-height:64px}
.tool b{font-weight:800;font-size:15px}.tool span{font-size:12px;color:var(--muted)}
.card.year{color:var(--ink);background:linear-gradient(160deg,#F8FAFC,#EEF2FF);border:1px solid #E0E7FF}
.year .label{color:var(--muted)}
.yr-grid > div{background:#fff;border:1px solid var(--line)}
.yr-grid span{opacity:1;color:var(--muted)}
.year .small{opacity:1!important;color:var(--muted)}


.nav-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#B91C1C;color:#fff;font:800 12px/18px var(--f-body);text-align:center}
nav.tabs a{position:relative}
.rv-tag{font-size:12px;font-weight:800;color:#92400E;background:#FEF3C7;border-radius:999px;padding:2px 7px;align-self:center;margin-right:4px}
body.hide-amts .num,body.hide-amts .big,body.hide-amts .amt,body.hide-amts .pc-big,body.hide-amts .yr-big,body.hide-amts .bal-amt,body.hide-amts .big-out{filter:blur(8px);user-select:none}
.hrs{min-height:18px;text-align:center;margin-top:-8px}
.stale{color:#FEF3C7;font-weight:800}
.hero-em{display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;background:rgba(255,255,255,.95);color:#991B1B;font-weight:800;border-radius:12px;padding:10px 12px;text-align:left;min-height:44px}
.hero.h-emerg{background:linear-gradient(135deg,#1F2937,#374151 60%,#7F1D1D)}
.em-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.em-list span{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 9px;font-weight:700}
.fc-head{display:flex;flex-direction:column;gap:2px}.fc-head b{font:800 17px var(--f-display)}.fc-head span{font-size:13px;color:var(--muted)}
.fc-svg{width:100%;height:auto;display:block}
.fc-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.fc-area{fill:color-mix(in srgb,var(--accent) 12%,transparent)}
.fc.bad .fc-line{stroke:#B91C1C}.fc.bad .fc-area{fill:#FEE2E2}
.fc-zero{stroke:#B91C1C;stroke-dasharray:4 4;stroke-width:1.5}
.fc-dot{fill:var(--accent)}.fc.bad .fc-dot{fill:#B91C1C}
.worth{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.w-q{display:flex;flex-direction:column;min-width:0}.w-q span{font-size:13px;color:var(--muted)}.w-q b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-btns{display:flex;gap:8px}.w-b{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:20px}
.v-hrs{display:block;font-style:normal;font-size:13px;margin-top:4px;opacity:.85}
.rh{display:grid;grid-template-columns:118px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.rh b{text-align:right}.rh-bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}.rh-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.adj{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft)}
.adj > div:first-child{display:flex;flex-direction:column;min-width:0}.adj > div:first-child span{font-size:12.5px;color:var(--muted)}
.adj-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;font-size:13px}
.sm-btn{min-height:40px!important;padding:6px 12px!important;font-size:13px!important}
.smart{border-color:#C7D2FE;background:linear-gradient(135deg,#EEF2FF,#fff)}
.stmt-b{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;color:inherit;width:100%;border-color:#FDE68A;background:#FFFBEB}
.stmt-b .mid{display:flex;flex-direction:column}.stmt-b .mid span{font-size:12.5px;color:var(--muted)}
.sb-ic{width:38px;height:38px;border-radius:12px;background:#F59E0B;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.stmt-b .chev{color:var(--muted);font-size:20px}
.si{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.si.done{opacity:.7}.si-top{display:flex;justify-content:space-between;gap:10px}.si-top > span{display:flex;flex-direction:column;min-width:0}.si-top > span span{font-size:12.5px;color:var(--muted)}
.si-top em{font-style:normal;color:var(--warn-ink);font-weight:700}
.si-why{font-size:13px;color:var(--muted)}.si-btns{display:flex;gap:6px;flex-wrap:wrap}
.si-h{font-size:15px;margin:6px 0 0}
.receipt{background:var(--soft);border-radius:12px;padding:10px 12px}.receipt ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}.receipt li{display:flex;justify-content:space-between;gap:8px}
.uses{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.uses button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800}
.season{border-color:#DDD6FE;background:linear-gradient(135deg,#F5F3FF,#fff)}
.live-tag{font-size:11px;font-weight:800;color:#fff;background:#7C3AED;border-radius:999px;padding:1px 7px}
.celebrate{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:24px;animation:fadein .2s}
.cel-box{position:relative;z-index:2;background:#fff;border-radius:24px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:320px;width:100%}
.cel-box b{font:800 26px var(--f-display)}.cel-box span{color:var(--muted)}.cel-ic{font-size:44px}.cel-box .btn{width:100%;margin-top:8px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti i{animation:none;display:none}}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;display:block;object-fit:cover;box-shadow:0 4px 12px rgba(15,157,116,.3)}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:-.015em}
.top.has-month .brand > div{display:none}
.brand span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.month{display:flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:#fff;width:30px;height:30px;border-radius:999px;font-size:17px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.month span{font-weight:700;font-size:13px;min-width:112px;text-align:center;padding:0 4px}

/* Sections and cards */
section.view{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h2{font:700 20px/1.2 var(--f-display);margin:0;text-wrap:balance}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.link{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}

/* Hero */
.hero{background:var(--hero);color:#fff;border:0;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 34px rgba(14,165,233,.22),0 6px 14px rgba(15,157,116,.2);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero > *{position:relative;z-index:1}
.hero .label{color:rgba(255,255,255,.85)}
.hero .big{font:800 clamp(36px,11vw,50px)/1 var(--f-display);letter-spacing:-.025em}
.hero .big small{font-size:.38em;font-weight:700;opacity:.85;margin-right:6px;letter-spacing:0}
.hero .sub{font-size:13px;color:rgba(255,255,255,.88)}
.hero .neg{color:#FFE4E1}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:9px 11px;min-width:0}
.pill div:first-child{font-size:12px;opacity:.9}
.pill div:last-child{font:800 17px var(--f-display)}
.pills.two{grid-template-columns:repeat(2,1fr)}
.plan-card{border:0;color:#fff;display:flex;flex-direction:column;gap:16px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16),transparent 60%),linear-gradient(150deg,#6D28D9,#4338CA 60%,#1E3A8A);box-shadow:0 14px 30px rgba(79,70,229,.28)}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.pc-big{font:800 clamp(30px,9vw,38px)/1.1 var(--f-display);letter-spacing:-.02em;margin-top:4px}
.pc-big small{font-size:.42em;opacity:.8;margin-right:5px;letter-spacing:0}
.pc-chip{background:#A7F3D0;color:#064E3B;font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;white-space:nowrap}
.pc-chip.bad{background:#FECACA;color:#7F1D1D}
.pc-pay{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pc-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pc-lab2{font-size:13px;font-weight:700;opacity:.9}
.pc-steps{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.pc-steps b{font:800 26px var(--f-display);text-align:center;white-space:nowrap}
.pc-steps button{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#4338CA;font:800 20px/1 var(--f-display);cursor:pointer}
.pc-slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;background:linear-gradient(to right,#A7F3D0 var(--p,50%),rgba(255,255,255,.25) var(--p,50%));outline:none;margin:6px 0}
.pc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);border:0}
.pc-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
.pc-ends{font-size:12px;opacity:.75}
#ppRes{display:flex;flex-direction:column;gap:12px}
.pc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-stats div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 11px;min-width:0}
.pc-stats span{display:block;font-size:12px;opacity:.8}
.pc-stats b{font:800 17px var(--f-display)}
.pc-delta{font-size:13px;font-weight:700;border-radius:12px;padding:9px 12px}
.pc-delta.good{background:rgba(167,243,208,.2);color:#D1FAE5}
.pc-delta.bad{background:rgba(254,202,202,.2);color:#FEE2E2}
.pc-chart{display:flex;flex-direction:column;gap:6px}
.pc-bars{display:flex;align-items:flex-end;gap:3px;height:84px}
.pc-bars i{flex:1;border-radius:4px 4px 1px 1px;background:linear-gradient(to top,rgba(255,255,255,.35),rgba(255,255,255,.75))}
.pc-bars i:last-child{background:#A7F3D0}
.pc-free{background:#fff;color:#1F2937;border-radius:14px;padding:11px 13px;font-size:13px}
.pc-free b{color:#047857}
.pc-warn{background:#FEE2E2;color:#7F1D1D;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:700}
.btn.pc-use{background:#fff;color:#4338CA;border:0;width:100%;padding:13px}
.btn.pc-reset{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);width:100%;padding:12px}
#ppBtns{flex-direction:column;gap:8px}
#ppBtns:empty{display:none}
.goal-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 6px 2px}
.goal-empty > span:not(.ge-ic):not(.ge-amt){color:var(--muted);font-size:15px;max-width:34ch}
.goal-empty > b{font:800 20px var(--f-display)}
.ge-ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#D1FAE5;color:#047857}
.ge-amt{font:800 30px var(--f-display);color:#047857;margin:2px 0 4px}
.ge-amt small{font-size:.45em;margin-right:4px;color:var(--muted)}
.goal-empty .btn.big{width:100%;max-width:320px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.txf{display:flex;flex-direction:column;gap:14px;--k:var(--bad)}
.txf[data-kind=refund]{--k:#10B981}.txf[data-kind=income]{--k:#059669}.txf[data-kind=payment]{--k:#7C3AED}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kind{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border-radius:14px;background:var(--sunk);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;line-height:1.15}
.kind input{position:absolute;opacity:0;pointer-events:none}
.k-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;font:800 15px var(--f-display);color:var(--muted)}
.kind:has(input:checked){background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--k),0 4px 10px rgba(0,0,0,.06)}
.kind:has(input:checked) .k-ic{background:var(--k);color:#fff}
.amt-box{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;padding:12px 12px 10px;border-radius:18px;background:color-mix(in srgb,var(--k) 7%,#fff);border:1.5px solid color-mix(in srgb,var(--k) 25%,transparent)}
.amt-cur{font:800 12px var(--f-display);color:var(--muted);letter-spacing:.12em}
.amt-box input[type=text]{border:0!important;background:transparent!important;box-shadow:none!important;padding:0;width:100%;text-align:center;font:800 42px/1.1 var(--f-display);color:var(--k);letter-spacing:-.02em}
.amt-box input::placeholder{color:color-mix(in srgb,var(--k) 35%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid transparent}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip:has(input:checked){background:color-mix(in srgb,var(--c) 14%,#fff);border-color:var(--c);color:var(--ink)}
.paychips{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.paychip{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;cursor:pointer;color:#fff;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 65%,#111827));transition:opacity .15s}
.paychips:has(input:checked) .paychip:not(:has(input:checked)){opacity:.4}
.paychip input{position:absolute;opacity:0;pointer-events:none}
.paychip .pc-type{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.paychip b{font:800 15px var(--f-display);letter-spacing:.04em;white-space:nowrap}
.paychip:has(input:checked){opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.dt-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dt-row .field{min-width:0}
.dt-row input{width:100%;min-width:0;box-sizing:border-box}
.sheet-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0));display:flex;gap:10px}
.btn.big{flex:1;padding:14px;font-size:17px;border-radius:14px}
.ccard{width:100%;border:0;text-align:left;color:#fff;cursor:pointer;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;aspect-ratio:1.9/1;max-height:180px;justify-content:space-between;background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,#0B1220));box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.ccard-top,.ccard-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:700}
.ccard-top span:first-child{text-transform:uppercase;letter-spacing:.07em;opacity:.9}
.ccard-top span:last-child{font-size:15px}
.ccard-num{font:800 clamp(17px,5.4vw,21px) var(--f-display);letter-spacing:.06em;white-space:nowrap}
.ccard-bot span:first-child{opacity:.85}
.ccard-edit{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 11px}
.cfg-edit{display:flex;flex-direction:column;gap:10px;padding:4px 2px 2px}
.hero-btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);color:#fff;font:700 15px var(--f-body,inherit);border-radius:999px;padding:9px 16px;cursor:pointer}
.hero-btn.sm{padding:4px 12px;font-size:13px}
.hero-warn{background:rgba(255,255,255,.95);color:#B42318;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700}
.bills{display:flex;flex-direction:column;gap:8px}
.bill{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"d m a" "d m t";gap:2px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft)}
.bill-d{grid-area:d;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);line-height:1}
.bill-d b{font:800 17px var(--f-display)}
.bill-d span{font-size:12px;color:var(--muted);margin-top:2px}
.bill .mid{grid-area:m;display:flex;flex-direction:column;min-width:0}
.bill .mid span{font-size:13px;color:var(--muted)}
.bill .amt{grid-area:a;font-weight:800;text-align:right}
.bill-tg{grid-area:t;justify-self:end;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.bill-tg[aria-pressed=true]{background:var(--good-ink);border-color:transparent;color:#fff}
.bill.paid{opacity:.65}
.bill.late .mid span{color:#B42318;font-weight:700}
.nsd{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nsd span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--sunk);color:var(--muted)}
.nsd span.free{background:#D1FAE5;color:#047857}
.nsd span.today{outline:2px solid var(--accent);outline-offset:1px}
.nsd b{margin-left:4px;color:#047857}
.home-seg{margin-bottom:2px}
.bal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bal{border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-width:0;color:#fff}
.bal.acc{background:linear-gradient(135deg,#0F9D74,#14B8A6)}
.bal.cc{background:linear-gradient(135deg,#1F2937,#374151)}
.bal-lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.bal-amt{font:800 22px/1.1 var(--f-display);white-space:nowrap}
.bal-amt small{font-size:.5em;opacity:.85;margin-right:4px}
.bal-sub{font-size:12px;opacity:.88}
.bal-bar{height:5px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:2px}
.bal-bar i{display:block;height:100%;background:#FBBF24;border-radius:999px}
.bal-due{align-self:flex-start;font-size:12px;font-weight:800;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 9px;margin-top:2px}
.bal-due.soon{background:#F59E0B;color:#1F2937}
.link-btn,a.link{display:inline-flex;align-items:center;min-height:36px;padding:4px 6px;margin:-4px -6px}
.hero-btn.sm{min-height:36px}
.back{display:inline-flex;align-items:center;min-height:40px;align-self:flex-start;font-weight:800;text-decoration:none;font-size:15px;padding:2px 0}
.due-chip{color:var(--muted);font-weight:700}.due-chip.soon{color:var(--warn-ink);font-weight:800}
.more-link{text-decoration:none;color:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit}
.more-link > span:first-child{display:flex;flex-direction:column;gap:2px}
.more-link > span:first-child span{font-size:13px;color:var(--muted)}
.more-link > span:last-child{font-size:26px;color:var(--accent)}
.period-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.period-bar i{display:block;height:100%;background:#fff;border-radius:999px}

/* Donut */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font:800 20px var(--f-display)}
.donut .mid span{font-size:12px;color:var(--muted)}
.leg{display:flex;flex-direction:column;gap:7px;min-width:0}
.leg div{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.leg div span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.sw{flex:0 0 10px;height:10px;border-radius:3px;background:var(--c)}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.leg{width:100%}}

/* Split bar */
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c)}

/* Budgets */
.cat-list{display:flex;flex-direction:column;gap:14px}
.cat-line{display:flex;flex-direction:column;gap:6px}
.cat-line .row b{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.bar{height:9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,#fff);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c)}
.bar i.over{background:var(--bad)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:color-mix(in srgb,var(--c) 55%,#000);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap}
.over-tag{color:var(--bad-ink);font-weight:700}

/* Trend chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font:600 12px var(--f-body);fill:var(--muted)}
.chart .vlab{font:700 12px var(--f-body);fill:var(--ink)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .avg{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.seg.mini{display:inline-flex;padding:2px}
.seg.mini button{padding:4px 12px;font-size:13px;flex:0 0 auto}

/* Comparison */
.cmp-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-box{background:var(--soft);border-radius:14px;padding:10px 12px}
.cmp-box div:first-child{font-size:12px;color:var(--muted)}
.cmp-box div:last-child{font:800 20px var(--f-display)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px}
.delta.up{color:#B4232A;background:#FDECEC}
.delta.down{color:#04704F;background:#E6F8F0}
.delta.flat{color:var(--muted);background:var(--sunk)}
.cmp-rows{display:flex;flex-direction:column;gap:9px}
.cmp-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:15px}
.cmp-row .nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.cmp-row .nm span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Alerts */
.alert{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:#FFF1F1;border:1px solid #F8C9CB}
.alert.near{background:#FFF8EB;border-color:#F8DDA6}
.alert h2{font-size:17px;display:flex;align-items:center;gap:8px}
.alert .ln{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.alert .ln b{font-weight:800}

/* Checklist */
.habits{display:flex;flex-direction:column;gap:8px}
.habits label{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:var(--soft);cursor:pointer;font-size:15px}
.habits input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.habits label:has(input:checked){background:#E8FAF3}
.habits label:has(input:checked) span{color:var(--muted);text-decoration:line-through}
.hprog{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.hprog i{display:block;height:100%;background:var(--hero)}

/* Insights */
.ins{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ins li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--t) 9%,#fff);font-size:15px}
.ins li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--t)}
.ins li{--t:#0EA5E9} .ins li.bad{--t:var(--bad)} .ins li.warn{--t:var(--warn)} .ins li.good{--t:var(--good)}

/* Buttons and forms */
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.grad{background:var(--hero);border:0;color:#fff}
.btn.danger{color:var(--bad-ink)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],input[type=search],select,textarea{
  width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{resize:vertical;min-height:90px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg label,.seg button{flex:1;text-align:center;border-radius:9px;padding:7px 4px;font-weight:700;font-size:15px;cursor:pointer;border:0;background:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked),.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);color:var(--accent)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.check input{margin-top:3px;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{width:32px;height:32px;border-radius:50%;background:var(--c);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){outline:3px solid var(--c);outline-offset:2px}
.swatches label:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}

/* Transactions */
.toolbar{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:38px;font-size:13px;font-weight:700;white-space:nowrap;color:color-mix(in srgb,var(--c,var(--ink)) 60%,#000)}
.chips button[aria-pressed=true]{background:color-mix(in srgb,var(--c,var(--ink)) 80%,#000);color:#fff;border-color:transparent}
.period-h{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 2px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.period-h b{font:800 17px var(--f-display)}
.day{display:flex;flex-direction:column}
.day h3{font-size:13px;font-weight:700;color:var(--muted);margin:10px 4px 6px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.tx + .tx{margin-top:7px}
.tx .ic{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 15px var(--f-display);color:color-mix(in srgb,var(--c) 55%,#000);background:color-mix(in srgb,var(--c) 16%,#fff)}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tx .amt{font:800 15px var(--f-display);white-space:nowrap}
.tx .amt.refund{color:var(--good-ink)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:14px 20px;background:var(--hero);color:#fff;font-weight:800;box-shadow:0 10px 24px rgba(14,165,233,.35)}

/* Empty / notes */
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:6px}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:#FFF7E6;color:#7A4B00}
.note.ok{background:#E8FAF3;color:#075E45}

/* Import preview */
.prev{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.prev label{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--soft);font-size:15px}
.prev label .mid{flex:1;min-width:0}
.prev label .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.prev .dup{opacity:.55}
.raw{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.tile{display:flex;gap:12px;align-items:flex-start}
.tile .ib{flex:0 0 42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:#fff}
.tile .ib svg{width:22px;height:22px}

/* Fixed costs editor */
.fx-list{display:flex;flex-direction:column;gap:8px}
.fx{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.fx[data-open=true]{border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 12%,transparent)}
.fx-head{display:flex;align-items:center;gap:12px;padding:12px;width:100%;border:0;background:none;text-align:left}
.fx-ic{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);font:800 17px var(--f-display)}
.fx-head .mid{flex:1;min-width:0}
.fx-head .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-head .mid span{display:block;font-size:13px;color:var(--muted)}
.fx-head .amt{font:800 17px var(--f-display);white-space:nowrap}
.fx-head .amt small{font:600 12px var(--f-body);color:var(--muted);margin-right:3px}
.fx-head .chev{color:var(--muted);font-size:20px;transition:transform .15s}
.fx[data-open=true] .chev{transform:rotate(90deg)}
.fx-edit{display:flex;flex-direction:column;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--soft)}
.fx-edit input{background:#fff}
.fx-edit .btns{justify-content:space-between}
.fx-ends{display:flex;gap:8px;align-items:center}
.fx-ends input{flex:1}
.fx-ends button{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;padding:6px}
.fx-total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,#fff);font-weight:700}
.fx-total b{font:800 20px var(--f-display);color:var(--accent)}
/* Plan tab */
.slider{width:100%;accent-color:var(--accent);height:28px}
.big-out{font:800 26px/1.1 var(--f-display)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:14px;padding:10px 11px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font:800 17px var(--f-display)}
.goodtxt{color:var(--good-ink)} .badtxt{color:var(--bad-ink)}
.timeline{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line);margin-left:6px;padding-left:14px}
.timeline div{position:relative;font-size:15px}
.timeline div::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px #fff}
.goal{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:16px;border:1px solid var(--line)}
.goal .row b{font-weight:800}
.goal .bar{height:10px}
.mini-btns{display:flex;gap:6px;flex-wrap:wrap}
.mini-btns button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 13px;min-height:38px;font-weight:700;font-size:13px}
.mini-btns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sub-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--soft)}
.sub-row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-row .yr{font:800 15px var(--f-display);text-align:right}
.sub-row .meta{font-size:13px;color:var(--muted)}
.sub-row.cancelled{opacity:.6}
.owed-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--soft)}
.owed-row .mid{flex:1;min-width:0}
.owed-row .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owed-row .mid span{font-size:13px;color:var(--muted)}
.owed-row .amt{font:800 15px var(--f-display);white-space:nowrap}
.tick{border:2px solid var(--line);background:#fff;width:30px;height:30px;border-radius:50%;flex:0 0 auto;font-weight:800;color:var(--good-ink)}
.tick.on{background:var(--good-ink);border-color:var(--good-ink);color:#fff}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;color:var(--ink);background:var(--soft);padding:0;min-width:0}
.cal button small{font-size:12px;font-weight:700;opacity:.85}
.cal button.zero{background:#E8FAF3;color:#067A55}
.cal button.future{opacity:.4}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
.cal .blank{visibility:hidden}
.cal-key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.cal-key i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.sync-st{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}
.sync-st i{width:9px;height:9px;border-radius:50%;background:var(--none)}
.sync-st.ok i{background:var(--good)} .sync-st.err i{background:var(--bad)} .sync-st.busy i{background:var(--warn)}
code.k{font-size:12px;background:var(--sunk);padding:2px 6px;border-radius:6px;word-break:break-all}
pre.code{font-size:12px;background:#0F172A;color:#E2E8F0;padding:12px;border-radius:12px;overflow-x:auto;white-space:pre;margin:0}
details.howto summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.howto ol{padding-left:20px;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
nav.tabs a{font-size:12px!important}
/* Cards / payment methods */
.paygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.paytile{border:0;text-align:left;color:#fff;border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-width:0;
  background:linear-gradient(140deg,var(--c) 0%,color-mix(in srgb,var(--c) 70%,#111827) 100%);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.pt-top{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.pt-num{letter-spacing:.08em}
.pt-amt{font:800 22px/1.1 var(--f-display)}
.pt-amt small{font-size:.5em;opacity:.85;margin-right:4px}
.pt-sub{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmchip{display:inline-block;margin-top:3px;font-size:12px;font-weight:800;padding:1px 7px;border-radius:999px;color:var(--p);background:color-mix(in srgb,var(--p) 13%,#fff)}
.tx .mid .pmchip{display:inline-block;width:auto}
.tx .amt.paid{color:var(--debt)}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:13px;text-align:left}
.ledger{display:flex;flex-direction:column;gap:7px;font-size:15px;background:var(--soft);border-radius:14px;padding:12px 14px}
.ledger div{display:flex;justify-content:space-between;gap:10px}
.ledger span{color:var(--muted)}
.ledger .plus{color:var(--bad-ink)} .ledger .minus{color:var(--good-ink)}
.ledger .tot{border-top:1px dashed var(--line);padding-top:7px}
.ledger .tot span{color:var(--ink);font-weight:700}
.ledger .tot b{font:800 17px var(--f-display)}
.cfg{display:flex;flex-direction:column;gap:10px}
.cfg-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cfg-face{display:flex;flex-direction:column;gap:2px;color:#fff;border-radius:12px;padding:9px 14px;min-width:150px;background:linear-gradient(140deg,var(--c) 0%,color-mix(in srgb,var(--c) 70%,#111827) 100%)}
.cfg-face span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.cfg-face b{font:800 17px var(--f-display);letter-spacing:.06em}
.danger-t{color:var(--bad-ink)}
/* Inputs with a unit, and iOS date fields that stay inside their column */
.affix{position:relative;display:block}
.affix input{padding-right:44px;padding-left:10px}
.affix > span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:800;color:var(--muted);pointer-events:none}
input[type=date],input[type=month],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;min-height:46px}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left}

/* Credit card preview */
.cc-face{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#DB2777 100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 28px rgba(124,58,237,.28);position:relative;overflow:hidden}
.cc-face::after{content:"";position:absolute;right:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.cc-face > *{position:relative;z-index:1}
.cc-lab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.cc-chip{font-size:12px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.cc-big{font:800 clamp(30px,9vw,38px)/1 var(--f-display);letter-spacing:-.02em}
.cc-big small{font-size:.42em;opacity:.85;margin-right:6px;letter-spacing:0}
.cc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc-stats div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px;min-width:0}
.cc-stats span{display:block;font-size:12px;opacity:.88}
.cc-stats b{font:800 15px var(--f-display)}
.save-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--shadow)}
.save-bar .btn{flex:0 0 auto}
.add-row{border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px;font-weight:700;color:var(--accent);width:100%}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;border-radius:14px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current=page]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(21,24,39,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;

<script>
(() => {
"use strict";
/* ---------- Google Sheet store: local-first, synced through your Apps Script ---------- */
const Store = (() => {
  const LS = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };
  let url = LS.get("masarif.api") || "", token = LS.get("masarif.token") || "";
  let docs = new Map(), fromServer = false, inbox = [], lastLoad = 0, error = "", loading = false;
  let pending = []; try { pending = JSON.parse(LS.get("masarif.pending") || "[]"); } catch {}
  try { for (const [c, id, d] of JSON.parse(LS.get("masarif.cache") || "[]")) docs.set(c + "/" + id, d); } catch {}
  for (const w of pending) { if (w.data === null) docs.delete(w.c + "/" + w.id); else docs.set(w.c + "/" + w.id, w.data); }
  const collL = {}, docL = {};
  const meta = () => ({ fromCache: !fromServer, hasPendingWrites: pending.length > 0 });
  const snapDoc = (c, id) => { const d = docs.get(c + "/" + id); return { id, exists: !!d, data: () => d, metadata: meta() }; };
  const snapColl = c => { const arr = []; for (const [k, d] of docs) if (k.startsWith(c + "/")) { const id = k.slice(c.length + 1); arr.push({ id, exists: true, data: () => d, metadata: meta() }); } return { docs: arr, size: arr.length, empty: !arr.length, metadata: meta(), docChanges: () => [] }; };
  const emit = (c, id) => { (collL[c] || []).forEach(f => f(snapColl(c))); (docL[c + "/" + id] || []).forEach(f => f(snapDoc(c, id))); };
  const emitAll = () => { for (const c in collL) collL[c].forEach(f => f(snapColl(c))); for (const k in docL) { const i = k.indexOf("/"); docL[k].forEach(f => f(snapDoc(k.slice(0, i), k.slice(i + 1)))); } };
  const saveCache = () => { const arr = []; for (const [k, d] of docs) { const i = k.indexOf("/"); arr.push([k.slice(0, i), k.slice(i + 1), d]); } LS.set("masarif.cache", JSON.stringify(arr)); };
  const savePending = () => LS.set("masarif.pending", JSON.stringify(pending));
  let timer = null, flushing = null;
  function write(c, id, data) {
    const v = data === null ? null : JSON.parse(JSON.stringify(data));
    if (v === null) docs.delete(c + "/" + id); else docs.set(c + "/" + id, v);
    pending = pending.filter(w => !(w.c === c && w.id === id)); pending.push({ c, id, data: v });
    savePending(); saveCache(); emit(c, id);
    clearTimeout(timer); timer = setTimeout(flush, 500);
    return Promise.resolve();
  }
  async function post(body) {
    const r = await fetch(url, { method: "POST", body: JSON.stringify(Object.assign({ token }, body)) });
    return r.json();
  }
  async function flush() {
    if (flushing || !pending.length || !url) return;
    const batch = pending.slice(0, 150);
    flushing = post({ writes: batch }).then(j => {
      if (!j || !j.ok) throw new Error((j && j.error) || "save failed");
      pending = pending.filter(w => !batch.includes(w)); savePending(); error = "";
    }).catch(() => { error = "Couldn't save to your Google Sheet. Changes are kept on this phone and will be sent when you're back online."; })
      .finally(() => { flushing = null; if (window.__onStore) window.__onStore(); if (pending.length) setTimeout(flush, error ? 15000 : 300); });
  }
  async function load() {
    if (!url || loading) return;
    loading = true;
    try {
      await flush();
      const r = await fetch(url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) + "&action=all&t=" + Date.now());
      const j = await r.json();
      if (!j || !j.ok) throw new Error(j && j.error === "denied" ? "denied" : "bad");

/* ---------- insights ---------- */
function insights(key, d) {
  const out = [];
  if (!d.tx.length) { out.push({ t: "", x: "No purchases in this month yet. Import your shortcut file or bank texts from the Import tab." }); return out; }
  const nw = d.byGroup.need + d.byGroup.want;
  if (nw > 0) {
    const share = d.byGroup.want / nw;
    if (share >= 0.3) out.push({ t: "warn", x: `Wants are ${Math.round(share * 100)}% of your spending (${money(d.byGroup.want)}). Bringing that under 20% frees about ${money(d.byGroup.want - nw * 0.2)}.` });
    else if (d.byGroup.want > 0) out.push({ t: "good", x: `Wants are only ${Math.round(share * 100)}% of your spending. Keep it there.` });
  }
  const counts = {};
  for (const t of d.tx) { if (groupOf(t) !== "want" || t.kind === "refund") continue; const k = (t.merchant || "").trim().toLowerCase(); if (!k) continue; counts[k] = counts[k] || { n: 0, s: 0, name: t.merchant }; counts[k].n++; counts[k].s += +t.amount || 0; }
  const top = Object.values(counts).filter(c => c.n >= 3).sort((a, b) => b.s - a.s)[0];
  if (top) out.push({ t: "warn", x: `${top.name}: ${top.n} purchases, ${money(top.s)} this month. Halving it saves about ${money(top.s / 2)}.` });
  const cc = creditCard();
  if (cc && (d.byCard[cc.id] || 0) > 0 && cardNow().now > 0) out.push({ t: "warn", x: `You put ${money(d.byCard[cc.id])} on the credit card this month. While you're paying it off, use the debit card or cash so the balance doesn't grow.` });
  if (cc && +cc.limit > 0) { const u = cardNow().now / +cc.limit; if (u >= 0.3) out.push({ t: u >= 0.7 ? "bad" : "warn", x: `You're using ${Math.round(u * 100)}% of your credit limit. Under 30% is healthier for your credit record.` }); }
  const unset = d.tx.filter(t => !isFlow(t) && !cardById(t.cardId)).length;
  if (unset && cards().length) out.push({ t: "", x: `${unset} purchase${unset > 1 ? "s don't" : " doesn't"} say which card paid. Tap them on the Spending tab to set it.` });
  const none = d.tx.filter(t => !isFlow(t) && groupOf(t) === "none").length;
  if (none) out.push({ t: "", x: `${none} purchase${none > 1 ? "s have" : " has"} no category. Give them one so Need and Want stay accurate.` });
  if (key === curKey()) {
    const elapsed = daysDiff(pStart(key), todayStr()) + 1;
    const wantDays = new Set(d.tx.filter(t => groupOf(t) === "want" && t.kind !== "refund" && t.date <= todayStr()).map(t => t.date));
    const free = elapsed - wantDays.size;
    out.push({ t: free >= elapsed / 2 ? "good" : "", x: `${free} of ${elapsed} days this month had no Want spending.` });
  }
  const prev = periodData(shiftMonth(key, -1));
  if (prev.tx.length && prev.spend > 0 && key !== curKey()) {
    const ch = (d.spend - prev.spend) / prev.spend;
    out.push({ t: ch > 0 ? "warn" : "good", x: `Spending was ${Math.abs(Math.round(ch * 100))}% ${ch > 0 ? "higher" : "lower"} than the month before.` });
  }
  return out;
}

    const s = `<circle cx="64" cy="64" r="${r}" fill="none" stroke="${x.c}" stroke-width="18" stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${(C - Math.max(0, len - gap)).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"/>`;
    acc += len; return s;
  }).join("") : "";

    <div class="mid"><b class="num">${fmt(total)}</b><span>EGP spent</span></div></div>`;
}

/* Fixed payments that have a day set, placed on their date inside this month */
/* a bill counts as paid when a debit/transfer of the same amount (±1 EGP) shows up from 5 days before to 7 days after its date, inside the month */
function billPaidByText(amt, ds, ps, pn) {
  if (!(amt > 0)) return false;
  const lo = addDays(ds, -5), hi = addDays(ds, 7), credit = new Set(cards().filter(c => c.type === "credit").map(c => c.id));
  return S.txns.some(t => !t.deleted && t.date && t.date >= lo && t.date <= hi && t.date >= ps && t.date < pn && (t.kind === "expense" || t.kind === "payment") && !credit.has(t.cardId) && Math.abs((+t.amount || 0) - amt) <= 1);
}
function billMatch(t, cache) {
  if (!t || t.kind !== "expense") return false;
  const k = pKeyOf(t.date), c = cache || {}; if (!c[k]) c[k] = billsFor(k);
  return c[k].some(b => b.auto && Math.abs(b.amount - (+t.amount || 0)) <= 1 && t.date >= addDays(b.date, -5) && t.date <= addDays(b.date, 7));
}
function billsFor(key) {
  const ps = pStart(key), pn = pNext(key), done = (S.checks[key] || {}).bills || {};
  const out = [];
  activeFixed(key).forEach(f => {
    const day = Math.round(+f.day || 0); if (day < 1) return;
    const d = toDate(ps);
    for (let i = 0; i < 32; i++) {
      const ds = toStr(d); if (ds >= pn) break;
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      if (d.getDate() === Math.min(day, last)) { const amt = +f.amount || 0, auto = done[f.name] === undefined && billPaidByText(amt, ds, ps, pn); out.push({ id: f.name, name: f.name, amount: amt, date: ds, paid: done[f.name] === true || auto, auto }); break; }
      d.setDate(d.getDate() + 1);
    }
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

      try {
        await db.collection("transactions").doc(r.id).set({ date: r.date, time: r.time || "", amount: r.amount, kind: r.kind || "expense",
          merchant: r.merchant || (r.kind === "payment" ? "Credit card payment" : ""), note: "", categoryId: r.categoryId || null, cardId: r.cardId || null, source: r.source, raw: r.raw || "", createdAt: Date.now() });
        done++;
      } catch (e) { failed++; if (e && e.code === "quota_exceeded") queue.length = 0; }
      if (msg) msg.textContent = `Saving ${done + failed} of ${rows.length}…`;
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  S.importRows = null; S.importNote = "";
  const box = $("#importPrev");
  if (box) {
    const ls = limitStatus(periodData(curKey()));
    box.innerHTML = `<div class="note ok">Imported ${done} purchase${done === 1 ? "" : "s"}.${failed ? ` ${failed} couldn't be saved; try importing again.` : ""} <a href="#txns" style="font-weight:700">See them</a></div>
      ${ls.over.length ? `<div class="alert" role="alert"><h2>Over the limit this month</h2>${ls.over.map(x => `<div class="ln"><span>${esc(x.c.name)}</span><span class="num"><b>${fmt(x.s)}</b> / ${fmt(x.lim)}</span></div>`).join("")}</div>` : ""}`;
  }
}

const wrap = $("#sheetWrap"), sheet = $("#sheet");

function closeSheet() { wrap.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = ""; }

document.addEventListener("keydown", e => { if (e.key === "Escape" && !wrap.hidden) closeSheet(); });
function catOptions(sel) {
  return `<option value="">No category</option>` + ["need", "want", "debt"].map(g => {

function openTx(id, preset) {
  const t = id ? S.txns.find(x => x.id === id) : null;
  if (id && !t) return;
  const defDate = S.month === curKey() ? todayStr() : pStart(S.month);
  const v = t || Object.assign({ date: defDate, time: "", amount: "", kind: "expense", merchant: "", note: "", categoryId: "", cardId: settings().defaultCardId || "" }, preset || {});
  const ico = d => `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const KINDS = [["expense", "Spent", ico('<path d="M6 12h12"/>')], ["refund", "Refund", ico('<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>')], ["payment", "Card payment", ico('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>')], ["income", "Money in", ico('<path d="M12 6v12M6 12h12"/>')]];
  const catChips = `<label class="chip" style="--c:${NONE_COLOR}"><input type="radio" name="tcat" value="" ${!v.categoryId ? "checked" : ""}><span class="dot"></span>None</label>` +
    S.cats.map(c => `<label class="chip" style="--c:${catColor(c)}"><input type="radio" name="tcat" value="${esc(c.id)}" ${c.id === v.categoryId ? "checked" : ""}><span class="dot"></span>${esc(c.name)}</label>`).join("");

  const topM = Object.entries(merchants).sort((a, b) => b[1].total - a[1].total).slice(0, 12).map(([name, v]) => ({ name, count: v.count, total: Math.round(v.total) }));
  const isCur = S.month === curKey();
  const summary = { period: pLabel(S.month, true), today: todayStr(), daysLeftInPeriod: isCur ? daysDiff(todayStr(), pNext(S.month)) : 0,
    salary: d.salary, fixedPayments: d.fixed.map(f => ({ name: f.name, amount: +f.amount, until: f.until || null })),

    creditCard: { owedNow: Math.round(cardNow().now), monthlyInterestRate: +st.card.rate, plannedMonthlyPayment: +st.card.payment } };
  const prompt = `I live in Egypt and I'm cutting my spending to pay off my credit card quickly. Amounts are in Egyptian pounds (EGP). My month runs from payday to payday. Here is this month so far, from my Masarif app:\n\n${JSON.stringify(summary, null, 1)}\n\nGive me 5 specific, practical actions for the rest of this month based on these numbers, each naming the category or shop and roughly how many EGP it would save. Then one line on how much faster the card could be paid off if I put those savings on it.`;
  let copied = false;
  try { await navigator.clipboard.writeText(prompt); copied = true; } catch {}
  out.hidden = false;
  if (copied) {
    out.innerHTML = `<b>Your month is copied.</b> Open Claude, paste it in a new chat, and send.<div class="btns" style="margin-top:10px"><a class="btn grad" href="https://claude.ai/new" style="text-decoration:none">Open Claude</a></div>`;
  } else {

    const ta = out.querySelector("textarea"); ta.value = prompt; ta.select();
  }
}

let toastTimer = null;

}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const catOpts = (sel, none) => `<option value="">${none || "No category"}</option>` + S.cats.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("");

const fuelCat = () => S.cats.find(c => c.id === "fuel") || S.cats.find(c => /fuel|petrol|بنزين|وقود/i.test(c.name || ""));
const isSpend = t => !t.deleted && t.date && !isFlow(t);
const spendTx = () => S.txns.filter(isSpend);

/* ---------- weeks, challenge, leftovers ---------- */
const challengeGoal = () => Math.max(0, Math.min(7, +((settings().challenge || {}).noSpend ?? 2)));
function noSpendDays(ws, upto) {
  const days = []; for (let x = toDate(ws), i = 0; i < 7; i++, x.setDate(x.getDate() + 1)) { const s = toStr(x); if (s > upto) break; days.push(s); }
  const spent = new Set(S.txns.filter(t => isSpend(t) && t.kind !== "refund" && t.date >= ws && t.date <= upto).map(t => t.date));
  return { days, spent, free: days.filter(d => !spent.has(d)) };
}
/* Weeks in a row (finished weeks, newest first) that reached the no-spend goal */
function challengeStreak() {
  const goal = challengeGoal(); if (!goal) return 0;
  const first = S.txns.filter(isSpend).map(t => t.date).sort()[0]; if (!first) return 0;
  let ws = wkStart(todayStr()), n = 0;
  for (let i = 0; i < 52; i++) {
    const d = toDate(ws); d.setDate(d.getDate() - 7); ws = toStr(d);
    if (wkEnd(ws) < first) break;
    if (noSpendDays(ws, wkEnd(ws)).free.length >= goal) n++; else break;
  }
  return n;
}
function lastWeekLeftover() {
  const lim = +settings().weekLimit || 0; if (!lim) return null;
  const d = toDate(wkStart(todayStr())); d.setDate(d.getDate() - 7);
  const ws = toStr(d), w = weekData(ws);
  if (!S.txns.some(t => isSpend(t) && t.date <= wkEnd(ws))) return null;
  const left = Math.floor((lim - w.total) / 50) * 50;
  const st = S.weeks["w_" + ws] || {};
  if (left < 100 || st.moved || st.dismissed) return null;
  if (daysDiff(wkEnd(ws), todayStr()) > 4) return null;
  return { ws, left, spent: w.total, lim };
}
function leftoverCard() {
  const lo = lastWeekLeftover(); if (!lo) return "";
  return `<div class="card leftover">
    <div class="lo-top"><span class="lo-ic" aria-hidden="true">★</span><div><b>You stayed ${money(lo.left)} under last week</b><span>Spent ${money(lo.spent)} of your ${money(lo.lim)} limit. Put the difference in a savings pot so it doesn't get spent.</span></div></div>
    <div class="btns"><button type="button" class="btn grad" id="loMove" ${S.dbOk ? "" : "disabled"}>Move ${money(lo.left)} to a pot</button><button type="button" class="btn" id="loSkip">Not this time</button></div>
  </div>`;
}

function cardFreeInfo() {
  const st = settings(), cn = cardNow();
  if (cn.now <= 0) return { done: true };
  const po = payoff(cn.now, st.card.rate, st.card.payment);
  if (!po) return { never: true, now: cn.now };
  const end = pStart(shiftMonth(curKey(), po.months));
  const peak = Math.max(+st.card.peak || 0, cn.now, +st.card.balance || 0);
  return { now: cn.now, months: po.months, end, days: Math.max(0, daysDiff(todayStr(), end)), paidPct: peak ? (1 - cn.now / peak) * 100 : 0, peak };
}
function dueTxt() {
  const due = settings().card.dueDate; if (!due) return "";
  const n = daysDiff(todayStr(), due); if (n < 0) return "";
  const when = toDate(due).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  return `<br><b class="due-chip ${n <= 3 ? "soon" : ""}">${n === 0 ? "Payment due today" : `Payment due ${when} · in ${plural(n, "day")}`}</b>`;
}
function countdownStrip() {
  const f = cardFreeInfo();
  if (!settings().card.balance && !f.now) return "";
  if (f.done) return `<a class="countdown done" href="#plan"><span class="cd-num">✓</span><span><b>Credit card paid off</b><span>Every month's payment can now go to savings.</span></span></a>`;
  if (f.never) return `<a class="countdown bad" href="#plan"><span class="cd-num">!</span><span><b>The card payment is too low</b><span>It doesn't cover the interest. Open Plan to fix it.</span></span></a>`;
  const endL = toDate(f.end).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  return `<a class="countdown" href="#plan">
    <span class="cd-num num">${f.days}<small>days</small></span>
    <span class="cd-mid"><b>to a card-free life</b><span>${esc(endL)} · ${fmt(f.now)} left${dueTxt()}</span><span class="cd-bar"><i style="width:${Math.max(2, f.paidPct).toFixed(1)}%"></i></span></span>
    <span class="cd-chev" aria-hidden="true">›</span>
  </a>`;
}

/* ---------- health hero (colour shows how the week is going) ---------- */
function healthOf() {
  const an = accountNow(), key = curKey(), today = todayStr();
  const toPay = billsFor(key).filter(b => !b.paid).reduce((a, b) => a + b.amount, 0);
  const days = Math.max(1, daysDiff(today, pNext(key)));
  const free = an.now - toPay;
  const lim = +settings().weekLimit || 0, ws = wkStart(today), w = weekData(ws);
  const dayN = daysDiff(ws, today) + 1, pace = lim * dayN / 7;
  let level = "good", why = "You're on track this week.";
  if (an.set && free < 0) { level = "bad"; why = "Your bills before payday are more than your balance."; }
  else if (lim && w.total > lim) { level = "bad"; why = `Over this week's limit. Essentials only until Saturday.`; }
  else if (lim && w.total > pace * 1.1) { level = "warn"; why = `A bit fast this week. Try a no-spend day to get back on pace.`; }
  else if (an.set && free / days < 100) { level = "warn"; why = "Money is tight until payday."; }
  return { level, why, an, toPay, days, free, perDay: Math.max(0, free) / days };
}
function healthHero() {
  const st = settings(), h = healthOf(), key = curKey();
  const payday = toDate(pNext(key)).toLocaleDateString("en-GB", { day: "numeric", month: "short" });

      <div><button type="button" class="hero-btn" data-bal>Add my bank balance</button></div>
    </div>`;
  const word = { good: "On track", warn: "Slow down", bad: "Over" }[h.level];
  return `<div class="hero h-${h.level}">

      <div class="big num ${h.an.now < 0 ? "neg" : ""}"><small>EGP</small>${fmt(h.an.now)}</div>

}
