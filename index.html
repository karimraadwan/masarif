function affordVerdict(amt, catId, payId) {
  const h = healthOf(), key = curKey(), today = todayStr(), pm = cardById(payId);
  const lines = []; let level = "good";
  const isCredit = pm && pm.type === "credit", isCash = pm && pm.type === "cash";
  if (h.an.set && !isCredit) {
    const after = (h.free - amt) / h.days;
    lines.push({ t: `Safe per day drops from <b>${fmt(h.perDay)}</b> to <b class="${after < 0 ? "badtxt" : ""}">${fmt(Math.max(0, after))}</b> until payday.`, l: after < 0 ? "bad" : after < 100 ? "warn" : "good" });
    if (h.free - amt < 0) lines.push({ t: `Your balance can't cover it and the bills before payday. You'd be ${money(amt - h.free)} short.`, l: "bad" });
  }
  const lim = +settings().weekLimit || 0;
  if (lim) {
    const w = weekData(wkStart(today)), left = lim - w.total - amt;
    lines.push({ t: left >= 0 ? `This week: ${money(left)} left of ${money(lim)} after it.` : `This week: it puts you <b class="badtxt">${money(-left)} over</b> your ${money(lim)} limit.`, l: left >= 0 ? (left < lim * 0.15 ? "warn" : "good") : "bad" });
  }
  const c = catById(catId);
  if (c) {
    const d = periodData(key), sp = d.byCat[c.id] || 0, b = +c.budget || 0;
    if (b) { const left = b - sp - amt; lines.push({ t: left >= 0 ? `${esc(c.name)}: ${money(left)} left of this month's ${money(b)}.` : `${esc(c.name)}: <b class="badtxt">${money(-left)} over</b> this month's ${money(b)} limit.`, l: left >= 0 ? "good" : "bad" }); }
    const wl = +c.weekly || 0;
    if (wl) { const ws2 = weekData(wkStart(today)).byCat[c.id] || 0, left = wl - ws2 - amt; lines.push({ t: left >= 0 ? `${esc(c.name)} this week: ${money(left)} left of ${money(wl)}.` : `${esc(c.name)} this week: <b class="badtxt">${money(-left)} over</b> its weekly ${money(wl)}.`, l: left >= 0 ? "good" : "bad" }); }
    if ((c.group || "need") === "want" && amt >= 1000) lines.push({ t: "It's a Want over EGP 1,000. Waiting 24 hours before buying often changes the answer.", l: "warn" });
  }
  if (isCredit) {
    const st = settings(), cn = cardNow(), r = +st.card.rate || 0;
    const a = payoff(cn.now, r, st.card.payment), b = payoff(cn.now + amt, r, st.card.payment);
    if (a && b) {
      const extraM = b.months - a.months, extraI = b.interest - a.interest;
      lines.push({ t: `On the credit card it really costs about <b>${money(amt + extraI)}</b> with interest${extraM > 0 ? `, and pushes your card-free date back ${plural(extraM, "month")}` : ""}.`, l: "warn" });
    }
  }
  if (isCash) lines.push({ t: "Paying cash: remember to add it so Masarif counts it.", l: "good" });
  if (emergencyOn() && c && (c.group || "need") === "want") lines.unshift({ t: "Emergency mode is on: wants wait until payday.", l: "bad" });
  if (!lines.length) return `<div class="verdict v-warn"><b>Not enough to judge yet</b><span>Add your bank balance, a weekly limit, or pick a category with a limit, and Masarif can tell you.</span></div>`;
  for (const x of lines) if (x.l === "bad") level = "bad"; else if (x.l === "warn" && level === "good") level = "warn";
  const head = { good: ["Yes, it fits", "It fits your plan."], warn: ["Possible, but careful", "It fits, with some trade-offs."], bad: ["Better not now", "It breaks part of your plan."] }[level];
  return `<div class="verdict v-${level}"><b>${head[0]}</b><span>${head[1]}</span>${hoursText(amt) ? `<em class="v-hrs">That's ${hoursText(amt)}.</em>` : ""}</div>
    <ul class="vlist">${lines.map(x => `<li class="${x.l}">${x.t}</li>`).join("")}</ul>`;
}

/* ---------- monthly score (0–100) ---------- */

/* ---------- yearly costs ---------- */
function yearlyRows() {
  const today = todayStr();
  return S.yearly.map(y => {
    let due = y.due || ""; if (!due) return null;
    while (due < today) due = shiftMonth(due.slice(0, 7), 12) + due.slice(7);
    const months = Math.max(1, Math.ceil(daysDiff(today, due) / 30.4));
    const left = Math.max(0, (+y.amount || 0) - (+y.saved || 0));
    return Object.assign({}, y, { dueNext: due, months, left, monthly: Math.ceil(left / months / 50) * 50 });
  }).filter(Boolean).sort((a, b) => a.dueNext.localeCompare(b.dueNext));
}
function yearlyCard() {
  const rows = yearlyRows(), per = rows.reduce((a, r) => a + r.monthly, 0);

/* ---------- what if ---------- */
function avgByCat(n) {
  const cur = curKey(), keys = Array.from({ length: n }, (_, i) => shiftMonth(cur, -1 - i)).filter(k => periodData(k).tx.length);
  const use = keys.length ? keys : [cur];
  const out = {}; for (const k of use) { const d = periodData(k); for (const c of S.cats) out[c.id] = (out[c.id] || 0) + (d.byCat[c.id] || 0) / use.length; }
  return out;
}
function whatIfCard() {
  const avg = avgByCat(3), list = S.cats.filter(c => (c.group || "need") !== "debt" && avg[c.id] > 0).sort((a, b) => avg[b.id] - avg[a.id]);
  if (!list.length) return "";
  const sel = S.wiCat && list.some(c => c.id === S.wiCat) ? S.wiCat : (list.find(c => c.group === "want") || list[0]).id;
  const a = avg[sel], cut = Math.min(S.wiCut ?? Math.round(a * 0.3 / 100) * 100, Math.ceil(a / 100) * 100);
  return `<div class="card stack">
    <div class="row"><h2>What if…</h2></div>
    <div class="wi-q">I spend <b class="num" id="wiCutOut">${money(cut)}</b> less a month on
      <select id="wiCat" aria-label="Category to spend less on">${list.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name)} (~${fmt(avg[c.id])}/mo)</option>`).join("")}</select></div>
    <input type="range" class="slider" id="wiCut" min="0" max="${Math.max(100, Math.ceil(a / 100) * 100)}" step="100" value="${cut}" aria-label="Amount to cut each month">
    <div id="wiRes"></div>
  </div>`;
}
function whatIfResult(cut) {
  const st = settings(), cn = cardNow(), r = +st.card.rate || 0, pay = +st.card.payment || 0;
  if (!cut) return `<div class="small muted">Move the slider to see what a cut would do.</div>`;
  if (cn.now > 0) {
    const a = payoff(cn.now, r, pay), b = payoff(cn.now, r, pay + cut);
    if (a && b) return `<div class="kpis"><div class="kpi"><span>Card-free</span><b>${monthAfter(b.months)}</b></div><div class="kpi"><span>Sooner by</span><b class="num goodtxt">${a.months - b.months ? plural(a.months - b.months, "month") : "< 1 month"}</b></div><div class="kpi"><span>Interest saved</span><b class="num goodtxt">${fmt(a.interest - b.interest)}</b></div></div>
      <div class="small muted">Putting the ${money(cut)} on the card each month. That's ${money(cut * 12)} a year.</div>`;
  }
  return `<div class="note ok">That's <b>${money(cut * 12)}</b> a year for your savings pots.</div>`;
}

function forecastData() {
  const an = accountNow(); if (!an.set) return null;
  const today = todayStr(), key = curKey(), end = pNext(key);
  const debitIds = new Set(cards().filter(c => c.type !== "credit").map(c => c.id));
  const since = addDays(today, -42);

  const bc = {};
  /* everyday spending only: loan/card instalments, bills and repeating purchases are added on their own dates below */
  let spent = 0; for (const t of S.txns) { if (t.deleted || !t.date || t.date < since || t.date >= today || isFlow(t) || !debitIds.has(t.cardId) || t.recurring || groupOf(t) === "debt" || billMatch(t, bc)) continue; spent += signed(t); }
  const firstTx = S.txns.filter(t => !t.deleted && t.date && debitIds.has(t.cardId)).map(t => t.date).sort()[0];

/* ---------- your rhythm: weekend vs weekday, first week effect ---------- */
function rhythmCard() {
  const since = toStr(new Date(Date.now() - 90 * 864e5)), today = todayStr();
  const tx = S.txns.filter(t => isSpend(t) && t.date >= since && groupOf(t) !== "debt");
  if (tx.length < 10) return `<div class="card stack"><h2>Your rhythm</h2><div class="small muted">After a few more weeks of purchases, this compares weekends with weekdays, and the first week after payday with the rest of the month.</div></div>`;
  const days = daysDiff(since, today) + 1;
  let wkend = 0, wkday = 0, nE = 0, nD = 0;
  for (let d = toDate(since), i = 0; i < days; i++, d.setDate(d.getDate() + 1)) { const g = d.getDay(); if (g === 4 || g === 5 || g === 6) nE++; else nD++; }
  for (const t of tx) { const g = toDate(t.date).getDay(); if (g === 4 || g === 5 || g === 6) wkend += signed(t); else wkday += signed(t); }
  const aE = wkend / Math.max(1, nE), aD = wkday / Math.max(1, nD);
  let first = 0, rest = 0, nF = 0, nR = 0;
  for (let d = toDate(since), i = 0; i < days; i++, d.setDate(d.getDate() + 1)) { const s = toStr(d), off = daysDiff(pStart(pKeyOf(s)), s); if (off < 7) nF++; else nR++; }
  for (const t of tx) { const off = daysDiff(pStart(pKeyOf(t.date)), t.date); if (off < 7) first += signed(t); else rest += signed(t); }
  const aF = first / Math.max(1, nF), aR = rest / Math.max(1, nR);
  const bar = (a, b) => { const m = Math.max(a, b) || 1; return [a / m * 100, b / m * 100]; };
  const [e1, e2] = bar(aE, aD), [f1, f2] = bar(aF, aR);
  const diffE = aD ? Math.round((aE / aD - 1) * 100) : 0, diffF = aR ? Math.round((aF / aR - 1) * 100) : 0;
  return `<div class="card stack">
    <div class="row"><h2>Your rhythm</h2><span class="small muted">a day, last 90 days</span></div>
    <div class="rh"><span>Thu–Sat</span><span class="rh-bar"><i style="width:${e1.toFixed(0)}%;background:#F97316"></i></span><b class="num">${fmt(aE)}</b></div>
    <div class="rh"><span>Sun–Wed</span><span class="rh-bar"><i style="width:${e2.toFixed(0)}%"></i></span><b class="num">${fmt(aD)}</b></div>
    <div class="note">${Math.abs(diffE) < 10 ? "Your weekends and weekdays cost about the same." : diffE > 0 ? `Weekends cost <b>${diffE}% more</b> a day than weekdays. Planning one weekend outing in advance usually helps.` : `Weekdays cost ${-diffE}% more than weekends. Work days (lunches, coffee, fuel) are where to look.`}</div>
    <div class="rh"><span>First week after payday</span><span class="rh-bar"><i style="width:${f1.toFixed(0)}%;background:#8B5CF6"></i></span><b class="num">${fmt(aF)}</b></div>
    <div class="rh"><span>Rest of the month</span><span class="rh-bar"><i style="width:${f2.toFixed(0)}%"></i></span><b class="num">${fmt(aR)}</b></div>
    <div class="note">${Math.abs(diffF) < 15 ? "Your spending is steady through the month." : diffF > 0 ? `You spend <b>${diffF}% more</b> a day in the first week after payday. Moving savings out on payday (the payday routine) stops this.` : "You spend less right after payday than later in the month."}</div>
  </div>`;
}

/* ---------- smart adjustments (after 2+ full months) ---------- */
function smartAdjust() {
  const cur = curKey(), done = [1, 2, 3].map(i => shiftMonth(cur, -i)).filter(k => periodData(k).tx.filter(t => !isFlow(t)).length >= 10);
  if (done.length < 2) return { ready: false, months: done.length };
  const avg = {}; for (const k of done) { const d = periodData(k); for (const c of S.cats) avg[c.id] = (avg[c.id] || 0) + (d.byCat[c.id] || 0) / done.length; }
  const items = [];
  for (const c of S.cats) {
    if ((c.group || "need") === "debt") continue;
    const b = +c.budget || 0, a = avg[c.id] || 0; if (!a && !b) continue;
    const r100 = v => Math.max(100, Math.ceil(v / 100) * 100);
    if (b && a > b * 1.1) items.push({ c, from: b, to: r100(a), why: `You've spent about ${money(a)} a month, ${pct(a - b, b)}% over.`, kind: "up" });
    else if (b && a >= 100 && a < b * 0.7 && b - a >= 200) items.push({ c, from: b, to: r100(a * 1.1), why: `You only use about ${money(a)}. Lowering it frees ${money(b - r100(a * 1.1))} for the plan.`, kind: "down" });
    else if (!b && a >= 300) items.push({ c, from: 0, to: r100(a), why: `No limit yet; you spend about ${money(a)} a month.`, kind: "new" });
  }
  const st = settings(), plan = Math.max(0, (+st.salary || 0) - activeFixed(cur).reduce((x, f) => x + (+f.amount || 0), 0) - (cardNow().now > 0 ? (+st.card.payment || 0) : 0));
  const newTotal = S.cats.reduce((x, c) => { const it = items.find(i => i.c.id === c.id); return x + (it ? it.to : (+c.budget || 0)); }, 0);
  const weeksAvg = Math.round(done.reduce((x, k) => x + periodData(k).spend, 0) / done.length / (30.4 / 7) / 100) * 100;
  return { ready: true, months: done.length, items, plan, newTotal, fits: newTotal <= plan, weekly: weeksAvg, weekNow: +st.weekLimit || 0 };
}
function smartCard(compact) {
  const s = smartAdjust();
  if (!s.ready) return compact ? "" : `<div class="card stack"><h2>Smart limit check</h2><div class="small muted">After 2 full months of purchases, Masarif suggests realistic limits from how you really spend. ${s.months ? "1 month done, 1 to go." : ""}</div></div>`;
  const key = "adj_" + curKey(); let seen = false; try { seen = localStorage.getItem("masarif." + key) === "1"; } catch {}

      ${compact ? (s.items.length > 2 ? `<a class="link" href="#insights">See all ${s.items.length} suggestions ›</a>` : "") : `<div class="note ${s.fits ? "ok" : ""}">${s.fits ? `With these, your limits add up to ${money(s.newTotal)}, which fits the ${money(s.plan)} left after bills and the card payment.` : `Careful: these add up to ${money(s.newTotal)}, more than the ${money(s.plan)} you have after bills and the card. Apply the ones that lower limits, and cut a "want" instead of raising everything.`}</div>`}`

    ${!compact && s.weekly && Math.abs(s.weekly - s.weekNow) >= 300 ? `<div class="adj"><div><b>Weekly limit</b><span>You usually spend about ${money(s.weekly)} a week.</span></div><div class="adj-r"><span class="num">${s.weekNow ? fmt(s.weekNow) : "—"} → <b>${fmt(s.weekly)}</b></span><button type="button" class="btn sm-btn" data-adjwk="${s.weekly}">Apply</button></div></div>` : ""}

function milestoneList() {
  const out = [], cn = cardNow(), st = settings(), peak = Math.max(+st.card.peak || 0, +st.card.balance || 0, cn.now);

  if (peak > 0 && cn.now <= 0) out.push({ id: "card_free", big: "Card-free!", text: "You paid off the credit card. Huge!" });
  for (const g of S.goals) if (+g.target > 0 && +g.saved >= +g.target) out.push({ id: "pot_" + g.id, big: "Pot full!", text: `${g.name} reached ${money(g.target)}.` });

  const prev = shiftMonth(curKey(), -1); if (periodData(prev).tx.length > 10 && monthScore(prev).score >= 80) out.push({ id: "score_" + prev, big: `Score ${monthScore(prev).score}`, text: "Last month was excellent." });

}

/* everyday spending between two dates (same rules as the weekly total) */
function spendBetween(a, b) {
  let sum = 0;
  for (const t of S.txns) {
    if (t.deleted || !t.date || t.date < a || t.date > b || isFlow(t) || t.treat) continue;
    if (typeof seasonOf === "function" && seasonOf(t)) continue;
    for (const p of catParts(t)) if (groupOfCat(p.categoryId) !== "debt") sum += p.v;
  }
  return sum;
}

/* ---------- 1. treat yourself: every 3 wins unlocks a treat ---------- */
const treatCfg = () => Object.assign({ name: "A good meal out", budget: 600, every: 3, used: [] }, settings().treats || {});
function winsList() {
  const out = [], lim = +settings().weekLimit || 0, goal = challengeGoal(), today = todayStr();
  const first = S.txns.filter(isSpend).map(t => t.date).sort()[0]; if (!first) return out;
  const since = treatCfg().since || first;
  let ws = wkStart(today);
  for (let i = 0; i < 26; i++) {
    ws = addDays(ws, -7); if (wkEnd(ws) < since || wkEnd(ws) < first) break;
    if (lim && spendBetween(ws, wkEnd(ws)) <= lim) out.push({ id: "wk_" + ws, text: `Under the weekly limit (week of ${dayLabel(ws)})` });
    if (goal && noSpendDays(ws, wkEnd(ws)).free.length >= goal) out.push({ id: "ns_" + ws, text: `${goal} no-spend days (week of ${dayLabel(ws)})` });
  }
  for (let k = shiftMonth(curKey(), -1), i = 0; i < 6; k = shiftMonth(k, -1), i++) {
    if (pEndStr(k) < since || periodData(k).tx.length < 10) break;
    if (monthScore(k).score >= 70) out.push({ id: "mo_" + k, text: `Month score ${monthScore(k).score} (${pLabel(k)})` });
  }
  return out;
}
let treatInit = false;
function treatState() {

  const c = treatCfg(), wins = winsList(), earned = Math.floor(wins.length / c.every);

}

/* ---------- 3. salary detection ---------- */

  if (!t || t.kind !== "income" || t.deleted) return false;

  if (/salary|payroll|راتب|مرتب/i.test(txt) || (sal > 0 && +t.amount >= sal * 0.6)) return true;
  /* salary moved over in parts (e.g. two transfers from your salary account on the same day) */
  if (!(sal > 0) || +t.amount < sal * 0.2 || !t.date) return false;
  const parts = S.txns.filter(x => x !== t && x.id !== t.id && !x.deleted && x.kind === "income" && x.date && Math.abs(daysDiff(x.date, t.date)) <= 1 && +x.amount >= sal * 0.2);
  return parts.reduce((a, x) => a + (+x.amount || 0), +t.amount) >= sal * 0.6;
}

/* ---------- 5. delivery tracker ---------- */
function deliveryStats(key) {
  const isD = t => isSpend(t) && t.kind === "expense" && DELIVERY_RE.test((t.merchant || "") + " " + (t.raw || ""));

  const sum = l => l.reduce((a, t) => a + (+t.amount || 0), 0);

const itemKey = n => String(n || "").toLowerCase().replace(/\d+(\.\d+)?\s?(g|kg|ml|l|pcs|x)\b/g, m => m.replace(/\s/g, "")).replace(/[^a-z0-9؀-ۿ. ]/g, " ").replace(/\s+/g, " ").trim();

    for (const it of (r && r.items) || []) { const k = itemKey(it.name), p = +it.price; if (!k || !(p > 0)) continue; (seen[k] = seen[k] || []).push({ name: it.name, p, date, shop }); }

/* ---------- 10. where did it go? (balance gap check) ---------- */
function gapCheck() {

/* ---------- 14. auto-category from location ---------- */

/* ---------- 16. price hikes at regular shops ---------- */
function priceHikes() {
  const since = addDays(todayStr(), -365), g = {};
  for (const t of S.txns) { if (t.deleted || t.kind !== "expense" || !t.merchant || t.date < since) continue; const k = nickKey(t.merchant); if (k) (g[k] = g[k] || []).push(t); }
  const out = [];
  for (const list of Object.values(g)) {
    if (list.length < 4) continue;
    list.sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
    const last = list[list.length - 1], earlier = list.slice(0, -1).map(t => +t.amount || 0), med = median(earlier);
    /* a fixed-price shop (gym, internet, a subscription): earlier payments within ±5%; a much bigger amount is a different purchase, not a price rise */
    if (!earlier.every(a => a >= med * 0.95 && a <= med * 1.05)) continue;
    const a = +last.amount || 0; if (a < med * 1.08 || a > med * 1.4 || daysDiff(last.date, todayStr()) > 60) continue;
    out.push({ name: shopName(last), from: med, to: a, pct: pct(a - med, med), yearly: (a - med) * list.length, id: last.id });
  }
  return out.sort((a, b) => b.yearly - a.yearly);
}

}

/* ---------- 17. spending personality ---------- */
function personality() {
  const since = addDays(todayStr(), -60), tx = S.txns.filter(t => isSpend(t) && t.kind === "expense" && t.date >= since && groupOf(t) !== "debt");
  if (tx.length < 15) return null;
  const sum = l => l.reduce((a, t) => a + (+t.amount || 0), 0), total = sum(tx) || 1;
  const days = daysDiff(since, todayStr()) + 1;
  let nE = 0, nF = 0; for (let i = 0; i < days; i++) { const d = addDays(since, i), g = toDate(d).getDay(); if (g >= 4) nE++; if (daysDiff(pStart(pKeyOf(d)), d) < 7) nF++; }
  const wkend = sum(tx.filter(t => toDate(t.date).getDay() >= 4)), first = sum(tx.filter(t => daysDiff(pStart(pKeyOf(t.date)), t.date) < 7));
  const eRatio = (wkend / Math.max(1, nE)) / Math.max(1, (total - wkend) / Math.max(1, days - nE));
  const fRatio = (first / Math.max(1, nF)) / Math.max(1, (total - first) / Math.max(1, days - nF));
  const deliv = sum(tx.filter(t => DELIVERY_RE.test((t.merchant || "") + " " + (t.raw || "")))) / total;
  const night = sum(tx.filter(t => t.time && (+t.time.slice(0, 2) >= 22 || +t.time.slice(0, 2) < 5))) / total;

  const cands = [

function inView(t, v) {
  if (v === "all") return true;
  if (v === "account") return t.kind === "income" || t.kind === "payment" || (debitIdSet().has(t.cardId) && (t.kind === "expense" || t.kind === "refund"));
  const c = cardById(v); if (!c) return false;
  if (c.type === "credit") return t.cardId === v ? t.kind !== "income" : t.kind === "payment" && (!t.cardId || !cardById(t.cardId) || cardById(t.cardId).type === "credit");
  return t.cardId === v && (t.kind === "expense" || t.kind === "refund");
}
/* bank balance after each transaction, worked out from your last balance update */
function accountBalances() {
  const a = settings().account || {}; if (!a.asOf) return null;
  const dset = debitIdSet(), eff = t => t.kind === "income" || (t.kind === "refund" && dset.has(t.cardId)) ? +t.amount || 0 : t.kind === "payment" || (t.kind === "expense" && dset.has(t.cardId)) ? -(+t.amount || 0) : 0;
  const list = S.txns.filter(t => !t.deleted && t.date && inView(t, "account")).sort((x, y) => -txSort(x, y));
  const after = list.filter(t => afterSnap(t, a.asOf, a.asOfTime)), before = list.filter(t => !afterSnap(t, a.asOf, a.asOfTime));
  const map = {}; let run = +a.balance || 0;
  for (const t of after) { run += eff(t); map[t.id] = run; }
  run = +a.balance || 0;
  for (let i = before.length - 1; i >= 0; i--) { map[before[i].id] = run; run -= eff(before[i]); }
  return map;
}
function acctHeader(v) {
  if (v === "all") return "";
  const key = S.scope === "period" ? S.month : curKey(), inK = t => inP(t.date, key) && !t.deleted;
  const list = S.txns.filter(t => inK(t) && inView(t, v)), sum = k => list.filter(t => t.kind === k).reduce((a, t) => a + (+t.amount || 0), 0);
  const per = esc(pLabel(key));
  if (v === "account") {
    const an = accountNow(), a = settings().account || {};
    return `<div class="card acct-h"><div class="ah-top"><span>Bank account</span><span class="small muted">${a.asOf ? "from your balance on " + esc(dayLabel(a.asOf)) : ""}</span></div>
      <b class="ah-big num">${a.asOf ? money(an.now) : "Add your balance"}</b>
      <div class="ah-kpis"><span>In <b class="num goodtxt">+${fmt(sum("income") + list.filter(t => t.kind === "refund").reduce((x, t) => x + (+t.amount || 0), 0))}</b></span><span>Out <b class="num">−${fmt(sum("expense") + sum("payment"))}</b></span><span class="muted">${per}</span></div></div>`;
  }
  const c = cardById(v);
  if (c && c.type === "credit") {
    const cn = cardNow(), lim = +c.limit || 0;
    return `<div class="card acct-h credit"><div class="ah-top"><span>Credit card ••${esc(c.last4 || "")}</span><span class="small muted">owed now</span></div>
      <b class="ah-big num">${money(cn.now)}</b>${lim ? `<div class="cm-bar"><i style="width:${Math.min(100, cn.now / lim * 100).toFixed(1)}%"></i></div>` : ""}
      <div class="ah-kpis"><span>Bought <b class="num">${fmt(sum("expense") - sum("refund"))}</b></span><span>Paid <b class="num goodtxt">${fmt(sum("payment"))}</b></span><span class="muted">${per}</span></div></div>`;
  }
  return `<div class="card acct-h"><div class="ah-top"><span>${c && c.type === "cash" ? "Cash" : "Debit card ••" + esc((c && c.last4) || "")}</span><span class="small muted">${per}</span></div>
    <b class="ah-big num">${money(sum("expense") - sum("refund"))}</b><div class="ah-kpis"><span>${plural(list.filter(t => t.kind === "expense").length, "purchase")}</span>${c && c.type !== "cash" ? `<span class="muted"></span>` : ""}</div></div>`;
}

/* ---------- routing & boot ---------- */
const VIEWS = ["home", "txns", "plan", "insights", "more", "cats", "import", "setup"];
function route() { const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : "home"; }
window.addEventListener("hashchange", () => { route(); closeSheet(); render(true); window.scrollTo(0, 0); });
$("#mPrev").onclick = () => { S.monthTouched = true; S.month = shiftMonth(S.month, -1); render(true); };
$("#mNext").onclick = () => { S.monthTouched = true; S.month = shiftMonth(S.month, 1); render(true); };
$("#fab").onclick = () => openTx(null);
$("#navAdd").onclick = () => { if (S.dbOk) openTx(null); };
$("#hdrEye").onclick = () => { try { localStorage.setItem("masarif.hide", hidden() ? "0" : "1"); } catch {} applyHide(); render(true); toast(HIDE ? "Amounts hidden. Tap the eye to show them." : "Amounts shown"); };

window.__onStore = () => { if (S.view === "import") render(true); else { const el = document.getElementById("syncSt"); if (el) el.querySelector("span").textContent = syncText(); } };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(false); });
window.addEventListener("online", () => { Store.flush(); refresh(true); });

function renderConnect(msg) {
  document.querySelector("nav.tabs").hidden = true; $("#fab").hidden = true; $("#monthBox").hidden = true;
  main.innerHTML = `<section class="view" style="padding-top:20px">
    <div class="hero" style="text-align:left">
      <div class="label">Welcome</div>
      <div style="font:800 30px/1.1 var(--f-display)">Connect Masarif to your Google Sheet</div>
      <div class="sub">Your purchases, categories and settings are stored in your own Masarif Inbox sheet. Only someone with your script link and secret word can open them.</div>
    </div>
    <form id="conForm" class="card stack">
      <label class="field"><span>Google script link (ends in /exec)</span><input type="text" inputmode="url" id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" required></label>
      <label class="field"><span>Secret word</span><input type="text" id="cTok" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <div class="btns"><button class="btn grad" type="submit" id="cGo">Connect</button></div>
      <div class="small ${msg ? "badtxt" : "muted"}" id="cMsg">${esc(msg || "Both are in the Apps Script you set up from the install guide.")}</div>
    </form>
  </section>`;
  $("#conForm").onsubmit = async e => {
    e.preventDefault();
    const u = $("#cUrl").value.trim(), t = $("#cTok").value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)) { $("#cMsg").textContent = "That doesn't look like a Google script link. Copy the Web app URL that ends in /exec."; $("#cMsg").className = "small badtxt"; return; }
    $("#cGo").disabled = true; $("#cMsg").className = "small muted"; $("#cMsg").textContent = "Checking…";
    let ok = false; try { ok = await Store.test(u, t); } catch {}
    if (!ok) { $("#cGo").disabled = false; $("#cMsg").className = "small badtxt"; $("#cMsg").textContent = "Couldn't connect. Check the link and that the secret word matches the one in your script exactly."; return; }
    Store.connect(u, t);
    document.querySelector("nav.tabs").hidden = false;
    start();
  };
}

let started = false;
function start() {
  if (started) { refresh(true); return; }
  started = true;
  db = Store.db; S.dbOk = true;
  route(); render(true);
  const timer = setTimeout(() => { if (!loaded()) { S.slow = true; render(); } }, 10000);
  const check = () => { if (loaded()) { clearTimeout(timer); S.slow = false; } };
  db.collection("categories").onSnapshot(snap => {
    S.cats = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (GROUP_ORDER[a.group] ?? 9) - (GROUP_ORDER[b.group] ?? 9) || (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(String(b.name)));
    if (!snap.metadata.fromCache) S.ready.c = true; check(); render();
  });
  db.collection("transactions").onSnapshot(snap => {
    S.txns = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (!snap.metadata.fromCache) { const first = !S.ready.t; S.ready.t = true; if (first && S.recurLoaded) runRecurring(); } check(); render();
  });
  const coll = (name, fn) => db.collection(name).onSnapshot(snap => { fn(snap); if (["plan", "home", "insights", "more", "txns"].includes(S.view)) render(); });
  coll("goals", snap => { S.goals = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); });
  coll("owed", snap => { S.owed = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); });
  coll("subs", snap => { S.subs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); });
  /* ids are saved as "m_2026-10" so Google Sheets keeps them as text instead of turning them into dates */
  coll("weeks", snap => { S.weeks = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); });
  coll("notes", snap => { S.notes = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); });
  coll("statements", snap => { S.statements = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); });
  coll("receipts", snap => { S.receipts = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); });
  coll("seasons", snap => { S.seasons = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); });
  coll("recurring", snap => { S.recurring = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); S.recurLoaded = !snap.metadata.fromCache; if (S.recurLoaded && S.ready.t) runRecurring(); });
  coll("yearly", snap => { S.yearly = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); });
  coll("checks", snap => { S.checks = Object.fromEntries(snap.docs.filter(d => /^m_\d{4}-\d{2}$/.test(d.id)).map(d => [d.id.slice(2), d.data()])); });
  db.doc("settings/main").onSnapshot(snap => {
    const before = startDay();
    S.settings = snap.exists ? snap.data() : null;
    if (!S.monthTouched || startDay() !== before) S.month = curKey();
    if (!snap.metadata.fromCache) S.ready.s = true; check(); render();
  });
  refresh(true);
}
function boot() {
  route();
  if (!Store.configured()) { renderConnect(); return; }
  start();
}
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
boot();
})();
</script>
